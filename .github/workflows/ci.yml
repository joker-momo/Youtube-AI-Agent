name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Ruff (lint + format check)
        run: ruff check .

      - name: Mypy (type check)
        run: mypy src
        continue-on-error: true  # type debt is tracked; not yet a hard gate

      # The render toolchain (node/ffmpeg/Remotion) is not provisioned here, so the
      # `integration`-marked exact-fixture continuity proof is excluded. On a runner
      # that provisions the toolchain, drop `-m "not integration"` to execute it —
      # it FAILs (not skips) on a render error.
      - name: Pytest (unit + regression)
        run: pytest -m "not integration" -q
