schema_version: "3.0-mvp"
channel:
  id: "vida-plena-45"
  name: "Vida Plena 45+: Salud y Bienestar"
  youtube_channel_id: "UCKUswqsAaLsEkcsgzTuKAmw"
  description: "Salud y bienestar práctico para personas de más de 45 años en España. Consejos sencillos sobre alimentación, descanso, movimiento suave y hábitos diarios, sin dietas extremas ni promesas milagro."
branding:
  # Intro/outro brand clips: intro.mp4 plays at the very start, outro.mp4 at the
  # very end (durations auto-probed). Enabled 2026-07-01 by request.
  enable_intro_outro: true
  intro_video_path: "asset_library/source/intro.mp4"
  outro_video_path: "asset_library/source/outro.mp4"
  # Channel-name label in the top-left corner. Hidden by default to keep the
  # opening frame clean. Flip to true when a special cut needs the brand
  # text visible on every scene.
  show_channel_name_overlay: false
audience:
  language: "es-ES"
  age_range: [45, 75]
  primary_markets: ["ES"]
  secondary_markets: ["MX", "CO", "AR", "CL", "PE"]
locale_style:
  target_locale: "Spain"
  language_code: "es-ES"
  timezone: "Europe/Madrid"
  lexical_preferences:
    prefer:
      - "móvil"
      - "ordenador"
      - "por la tarde"
      - "de madrugada"
      - "hábitos sencillos"
      - "personas de más de 45 años"
    avoid:
      - "celular"
      - "computadora"
      - "LatAm"
      - "adultos mayores"
      - "tercera edad"
      - "ancianos"
      - "abuelitos"
niche:
  category: "health_wellness"
  sub_niches:
    - "nutrition_45plus"
    - "exercise_low_impact"
    - "sleep_quality"
  avoid_topics:
    - "specific_medical_diagnoses"
    - "supplement_promotion"
    - "miracle_cures"
keyword_research:
  # Spain-first, 45+ concrete seeds used when Google Trends has no niche match.
  # Falls back to generic sub_niche keywords only if this list is absent.
  fallback_seeds:
    - "dormir mejor después de los 45"
    - "ejercicio suave después de los 45"
    - "cena ligera después de los 45"
    - "mente acelerada después de los 45"
    - "despertar cansado después de los 45"
    - "movimiento suave después de los 45"
    - "cansancio después de los 45"
    - "calma mental después de los 45"
brand_voice_path: "configs/vida-plena-45/brand-voice.md"
style_dna:
  path: "configs/vida-plena-45/style-dna.json"
  current_version: "mvp-v1"
personas:
  - id: "maria"
    profile_path: "configs/vida-plena-45/personas/maria.md"
    weight: 1.0
  - id: "carlos"
    profile_path: "configs/vida-plena-45/personas/carlos.md"
    weight: 1.0
  - id: "rosa"
    profile_path: "configs/vida-plena-45/personas/rosa.md"
    weight: 1.0
content_format:
  type: "long_form"
  target_duration_sec: 840        # soft per-scene sizing reference only; total length is content-driven (see duration_sec_min)
  duration_sec_min: 660           # 11 min — quality-first MINIMUM (drives script word floor); develop ideas fully
  duration_sec_max: 1800          # 30 min soft safety bound only — no hard trim; length follows content
  scenes_count_min: 40            # floor only; scene count scales up with script length (no hard cap)
  scenes_count_max: 55            # legacy reference; sharded planner may exceed when the script is longer
  publish_schedule:
    cadence: "3 per week"
    days: ["Monday", "Wednesday", "Friday"]
    time_local: "20:00"
    timezone: "Europe/Madrid"

qa_rules:
  script_path: "configs/vida-plena-45/qa-rules/script.yaml"
  scene_path: "configs/vida-plena-45/qa-rules/scene.yaml"
  asset_path: "configs/vida-plena-45/qa-rules/asset.yaml"
  thresholds:
    max_retry_per_qa: 3
    max_average_sentence_words: 20
    max_thumbnail_words: 6
positioning:
  forbidden_phrases:
    - "adultos mayores"
    - "tercera edad"
    - "ancianos"
    - "personas mayores"
    - "abuelos"
    - "abuelitos"
  preferred_phrases:
    - "personas de más de 45 años"
    - "adultos 45+"
    - "mediana edad"
    - "bienestar práctico"
research_gate:
  # keyword scoring free tier scores Spanish long-tail phrases lower than English.
  # Calibrated to 20 after observing that "insomnio" (short keyword) = 63
  # while "Insomnio despues de los 45..." (long phrase) = 26.
  # Topics with best_score >= 20 have real search presence; null scores
  # (not enough data) are allowed through (verdict=pass).
  min_score: 20
  max_competition: "High"
  min_tag_score: 20

thumbnail:
  # Persona/identity reference photo attached to every ChatGPT thumbnail gen so
  # the SAME presenter face appears across all thumbnails (brand consistency).
  persona_reference: "configs/vida-plena-45/persona/thumbnail_face.jpeg"

seo:
  language: "es-ES"
  min_tags: 5
  max_tags: 8
domain_plugins:
  - name: "medical_safety_checker"
    enabled: true
models:
  default: "mock-local"
tts:
  # Elena presenter voice — MeloTTS ES (local, MIT), middle-aged Spanish female.
  # Runs in a sidecar venv (tools/melo-venv) via a worker; see src/video_agent/tts.py
  # MeloTTSClient. Set up the venv with tools/setup-melo-venv.sh.
  provider: "melo"
  language: "ES"
  speed: 1.05                 # MeloTTS model tempo (pitch-safe); ~3% faster than 1.0
  pitch_shift_semitones: -1.0 # ages raw ~190 Hz → ~179 Hz (middle-aged); do not go below -1.5
  segmentation: "scene"       # synth whole-scene narration (MeloTTS handles prosody)
  device: "mps"
  sample_rate: 24000          # pipeline rate; melo's native 44100 is resampled down
  pace_wpm: 120
  scene_lead_in_sec: 0.45
  # Fallback engine: switch provider to "kokoro" (clause segmentation + humanize below).
  humanize:
    enabled: true
    pause_comma_ms: 230
    pause_semicolon_ms: 340
    pause_sentence_ms: 500
    pause_paragraph_ms: 700
    speed_jitter_pct: 3.5
visuals:
  strategy: "auto"
  source_dir: "asset_library/source"
  providers: ["pexels_video"]
  fallback_providers: []
  query_cache_ttl_hours: 24
  # Long-form videos are 16:9 → request landscape from Pexels.
  # Shorts override this to "portrait" automatically (see shorts.source.prefer_vertical_assets
  # and the auto-detect in pipeline.render_operator_job).
  orientation: "landscape"
  per_page: 10
  scene_count_target: 5
  # Editorial asset candidate selection (Shorts quality upgrade). Caps the number
  # of candidates scored per provider search / library cache, plus a cumulative
  # per-scene metadata-scoring cap across attempted cascade tiers. Kept out of the
  # LLM call_budget because Pexels/library candidate counts grow without LLM calls.
  asset_selection:
    enable_quality_scoring: true
    max_asset_candidates_per_provider: 12
    max_library_cache_candidates: 10
    max_candidate_metadata_score_total: 24
    quality_weight: 0.45
music:
  source: "assets/music"
  # BGM DISABLED 2026-06-30 (competitor teardown, 17 videos): our bed was -33dB
  # floor — louder than ALL competitors (those with music: -44..-54dB; top
  # performers IO2 144k / Enfermera Ana 450k use NO music). Clarity for 60+ wins.
  # Empty file -> _choose_bgm_track returns None -> narration only (no mix).
  # To re-enable: restore the path below + raise duck_db to ~18-20.
  file: ""
  voice_gain_db: -4.5
  level_db: -24
  duck_db: 8
  target_lufs: -15
  target_tp_dbtp: -1.5
  target_lra: 7
  sample_rate: 48000
  bitrate: "192k"
  stereo: true
render:
  composition: "ChannelVideoStandard"
  resolution: "1920x1080"
  fps: 30
  codec: "h264"
  # Bitrate-based encoding lets VideoToolbox HW encoder kick in (CRF mode forces software libx264).
  video_bitrate: "12M"
  # Use Metal-backed ANGLE so Chromium WebGL composites on GPU instead of CPU.
  gl: "angle"
  concurrency: "auto"
  # Remotion video frame-extraction threads (Remotion default 2). Shared decode-feeder
  # pool, NOT render concurrency. BENCHMARKED 2026-06-30 (1200-frame slice, real comp):
  #   threads=4 + conc=8 → 27.3 fps  (WINNER)
  #   threads=8 + conc=8 → 22.3 fps  (−18%: 8 threads oversubscribe the 8 cores,
  #                                    thrashing the 8 render workers)
  #   threads=4 + conc=4 → 22.8 fps  (−16%: confirms concurrency=auto/8 is optimal)
  # Sweet spot = 4. Pure speed; never touches render.concurrency (stays "auto").
  offthreadvideo_threads: 4
  # Segmented render (bug-441): split into segment_seconds-long chunks, each
  # its own Remotion invocation, then joined losslessly via ffmpeg concat
  # (stream copy). A crash mid-render (ENOSPC, network change, etc.) only
  # loses the CURRENT segment on the next attempt — completed segments are
  # verified on disk and reused. Never touches render.concurrency above.
  segmented: true
  segment_seconds: 120
  subtitles:
    enabled: true
    mode: "word_highlight"
    words_per_page: 6
    max_lines: 2
    position: "bottom"
    offset_sec: 0
    font_size: 40
    active_scale: 1.08
    background_opacity: 0.58
  audio_loudness:
    enabled: true
    integrated_lufs: -14
    true_peak_dbtp: -1
    lra: 11
upload:
  ai_disclosure: true
  default_privacy: "manual_upload_only"
budget:
  max_cost_per_video_usd: 0
# Long-form visual-span planning (independent of shorts.visual_timeline above).
# Phase 1: report_only — groups contiguous subtitle scenes onto one continuous
# background clip; never alters render until the Gate-1b grouping review passes.
# Parallel DAG pipeline: run post-scenes stages as concurrent resource lanes
# (ChatGPT browser ‖ local-MPS ‖ cpu). Local-MPS (whisper/TTS) overlaps the ChatGPT image lane.
# Off = legacy linear path (the renderer/stages are byte-for-byte identical).
pipeline:
  parallel_dag: true

visual:
  span_planning:
    enabled: true
    mode: report_only
    max_scenes_per_span: 3
    max_span_sec: 40
    groupable_layouts: [subtitle]
  # Hybrid graphic cards: render graphic-layout scenes as the generated card
  # shrunk & centered over a fixed brand-gradient bg video instead of full-bleed.
  # Kills the static "slideshow" feel of consecutive graphic scenes. Read by
  # pipeline branding builder -> render_props.branding.hybrid_card_bg.
  hybrid_card:
    enabled: true
    bg: "assets/brand_bg_soft.mp4"
shorts:
  enabled: true
  # One readable 9:16 poster, held still with a music-only bed.
  # This is intentionally separate from narrated, multi-scene Shorts.
  infographic:
    duration_sec: 15   # fallback length only when voice.enabled is false
    ken_burns: false
    # Synthesize a unique, traceable instrumental bed from math primitives.
    # No sample, artist reference, or third-party audio file is used.
    music_source: "procedural_original"
    music_bitrate: "192k"
    music_volume_db: -14
    music_fade_in_sec: 0.16
    music_fade_out_sec: 0.45
    # Sidechain ducking under the voice track (voice_plus_music mode only). Gentler
    # than narrated Shorts' 8dB: this music IS the ambience for a still poster, not
    # a bed under constantly-changing scenes, so it must stay clearly audible while
    # Elena speaks, not near-silent for the whole narration.
    voice_duck_db: 4.0
    # Elena (MeloTTS, see shorts.tts below) reads the poster's hook + items + cta.
    # When enabled, the Short's real length follows the spoken narration instead
    # of the fixed duration_sec above.
    voice:
      enabled: true
      padding_sec: 2.5        # breathing room after the narration ends
      min_duration_sec: 8.0
      max_duration_sec: 45.0  # YouTube Shorts ceiling is 60s; leave headroom
  # Visual span / compiled visual timeline (spec v4.0.3). Enforced mode makes
  # the compiled schedule the renderer contract for Shorts; PR D quality flow
  # remains report_only until semantic/detector adapters are available.
  visual_timeline:
    enabled: true
    mode: enforced                 # disabled | report_only | enforced
    schedule_schema_version: 2
    on_invalid_schedule: fail
    rollback:
      allow_legacy_renderer: false
      reason: ""
    span_planning:
      isolate_hook: true
      isolate_cta: true
      isolate_graphic_scenes: true
      max_scenes_per_span: 3
      max_span_sec: 10.0
    continuous_clip:
      enabled: true
      playback_rate: 1.0
      allow_loop: false
      require_native_video_for_multi_scene: true
      image_max_hold_sec: 2.5
      near_static_max_hold_sec: 3.5
      low_motion_max_hold_sec: 5.0
      normal_motion_max_hold_sec: 8.0
    candidate_budget:
      queries_per_span: 4
      results_per_query: 8
      metadata_shortlist: 10
      preview_downloads: 5
      final_candidates_retained: 2
      max_plan_variants: 3
    qa:
      local_only: true
      fail_closed_for_critical: true
      require_exact_continuity_fixture: true
      production_boundary_check_enabled: true
      semantic_model_enabled: false
      object_detector_enabled: false
    public_assets:
      unique_short_namespace: true
  visual_quality_flow:
    enabled: true
    mode: enforced                 # disabled | report_only | enforced
    # Channel-wide visual exclusions: Grounding DINO grounds these as forbidden in
    # every span, so a wellness channel for CAPABLE 45+ adults never pulls
    # disability/medical footage even when the literal query matches (e.g. the
    # hook intent "the chair" was matching wheelchair clips).
    avoid_visuals:
      - "wheelchair"
      - "hospital bed"
      - "crutches"
      - "walker mobility frame"
      - "oxygen mask"
      - "IV drip"
      - "hospital room"
    acquisition:
      span_aware: true
      provider: pexels_video
      allow_text_query_hints: true
      download_policy: top_finalists  # none | selected_only | top_finalists
      trim_margin_sec: 1.0
      minimum_width: 720
      minimum_height: 720
      max_queries_by_importance:
        critical: 4
        high: 3
        normal: 2
        low: 1
    local_qa:
      enabled: true
      max_runner_ups: 2
      # Optional LOCAL semantic vision cascade (spec §38), default OFF so baseline
      # is unaffected. Quality-first stack, M2-native:
      #   clip      = SigLIP2 topic pre-filter only
      #   clip_vlm  = SigLIP2 + Qwen2.5-VL-7B (MLX) holistic judge
      #   full      = + Grounding DINO forbidden-object grounding
      # Needs weights downloaded locally (transformers / mlx-vlm). No remote media.
      # 16GB Apple Silicon: SigLIP + Grounding DINO only (reliable on-device tier).
      # The Qwen-VL judge (clip_vlm/full) needs >=32GB RAM — it OOMs/hangs here,
      # though the subprocess worker + timeout make it degrade gracefully if set.
      semantic_adapter: clip        # none | clip | clip_vlm | full  (16GB tier: SigLIP+DINO; VLM-7B OOMs <32GB)
      detector_adapter: grounding_dino  # none | grounding_dino
      device: auto                  # auto | mps | cpu  (VLM always MLX on Apple Silicon)
      semantic_max_frames: 3   # trim start/mid/end — confirm the required action persists, not one lucky frame
      semantic_models:
        siglip: "google/siglip2-base-patch16-224"
        vlm: "mlx-community/Qwen2.5-VL-7B-Instruct-4bit"
        detector: "IDEA-Research/grounding-dino-base"
      semantic_thresholds:
        siglip_support: 0.18
        siglip_reject: 0.05
        detector_box: 0.35
        siglip_age_reject: 0.5   # young-vs-45+ logit margin → CONTRADICTED age_band
      # 45+ audience-fit: SigLIP zero-shot age gate (restores the demographic check
      # the OOM-prone VLM used to do; rejects young-people stock → on-brand AI elderly).
      enforce_age_band_45_plus: true
      critical_fail_closed: true
      report_only_never_blocks_render: true
    trim_selector:
      stride_sec: 0.5
      max_windows: 24
      reject_black_ratio: 0.05
      reject_unstable_motion: true
      dynamic_crop: false
    beat_planner:
      enabled: true
      max_non_legacy_plans: 3
      simplicity_margin_points: 3
      allow_inside_scene_boundary: false
      modes:
        - continuous_clip
        - two_clip
        - clip_plus_graphic
        - generated_image_fallback
    rollout:
      capture_features: true
      capture_manual_review: true
      auto_adjust_weights: false
      min_report_sample_size: 5
  studio:
    enabled: true
    job_list_policy: "all_with_disabled_ineligible"
  autopilot:
    enabled: true
    trigger: "after_review_passed"
    execution_mode: "sequential"
    run_after_long_review_pass: true
    allow_manual_button_for_existing_jobs: true
    manual_button_label: "Gen Video Shorts"
    require_user_choices: false
    require_user_review_before_render: false
    render_automatically: true
    render_only_if_qa_pass: true
    max_regeneration_attempts: 4
    skip_if_shorts_already_exist: true
    continue_if_one_short_fails: true
    archive_on_force_regenerate: true
    detect_legacy_shorts_artifacts: true
    concurrency:
      enabled: false
      llm_generation: 1
      qa: 1
      tts: 1
      audio_mix: 1
      remotion_render: 1
      manifest_write: 1
    retries:
      llm_generation: 2
      qa_regeneration: 2
      tts: 2
      audio_mix: 1
      render: 1
  llm:
    # Spec v6 §2 — AI role contract. Every call uses a fresh temporary chat.
    use_temporary_conversations: true
    planner_provider: "chatgpt"
    script_provider: "chatgpt"
    scenes_provider: "chatgpt"
    qa_provider: "gemini"
  auto_generate:
    enabled: true
    default_count: 3
    max_count: 5
    allow_fewer_if_candidates_are_weak: true
    require_user_choices: false
  duration:
    min_sec: 20
    target_min_sec: 25
    target_max_sec: 60
    hard_max_sec: 60
  render:
    format: "short"
    composition: "ShortVideoStandard"
    cover_composition: "ShortCover"
    resolution: "1080x1920"
    fps: 30
  source:
    require_long_job: true
    require_source_map: true
    use_whisper_timestamps: true
    allow_visual_reuse_from_long: true
    prefer_vertical_assets: true
  content:
    default_formats_per_long:
      - "pain_to_tip"
      - "mistake_to_avoid"
      - "mini_checklist"
    fallback_formats:
      - "myth_or_contradiction"
  tts:
    # Same Elena voice as long-form (MeloTTS ES) — keep one consistent voice across
    # the channel. Runs via the sidecar venv/worker (see top-level tts + tts.py).
    provider: "melo"
    language: "ES"
    speed: 1.05                 # match long-form; bump to ~1.07 here for snappier Shorts if wanted
    pitch_shift_semitones: -1.0
    segmentation: "scene"
    device: "mps"
    pace_wpm: 130
    # Shorts render one narration track over scenes timed by planned duration,
    # so per-scene audio must be padded to the plan (not shrunk to raw speech).
    # shorts/audio.py also forces this; set here for clarity.
    dynamic_sync: false
    sample_rate: 24000
    # Fallback engine: switch provider to "kokoro" (uses clause humanize below).
    humanize:
      enabled: true
      pause_comma_ms: 160
      pause_semicolon_ms: 240
      pause_sentence_ms: 360
      pause_paragraph_ms: 500
      speed_jitter_pct: 3.0
  music:
    enabled: true
    source: "music_library"
    auto_select: true
    volume_db_below_voice: 20
    ducking_enabled: true
    voice_gain_db: -4.5
    duck_db: 8
    target_lufs: -13.6
    target_tp_dbtp: -1.0
    target_lra: 4.8
    sample_rate: 44100
    bitrate: "192k"
    fade_in_ms: 120
    fade_out_ms: 450
    require_license_metadata: true
    allow_render_without_license_metadata: true
  cover:
    enabled: true
    export_cover_jpg: true
    cover_frame_sec: 0.3
    text_max_words: 5
    use_first_scene_as_cover: true
  funnel:
    cta_to_long_video: true
    cta_max_words: 12
    default_cta_without_url: "Vídeo completo en el canal."
    default_cta_with_url: "Mira la guía completa aquí."
    # Topic-aware CTA: {tema} is filled from the Short's pillar so the spoken
    # bridge names the long video's theme (falls back to the plain defaults above
    # when the topic can't be resolved). Kept within cta_max_words.
    cta_topic_template_without_url: "Más sobre {tema} en el canal."
    cta_topic_template_with_url: "Guía de {tema}, míralo en el canal."
    pinned_comment_template: |
      Si quieres ver la guía completa paso a paso, mira el vídeo largo del canal 👇
      {long_video_url}
music_library:
  tracks:
    shorts_movement:
      file: "assets/music/find_your_way_anno_domini_beats.mp3"
      title: "Find Your Way"
      artist: "Anno Domini Beats"
      source: "YouTube Studio Audio Library"
      mood: "soft_upbeat"
      use_for: ["movement", "exercise", "routine"]
      default_volume_db_below_voice: 20
    shorts_daily_habit:
      file: "assets/music/fresh_fallen_snow_chris_haugen.mp3"
      title: "Fresh Fallen Snow"
      artist: "Chris Haugen"
      source: "YouTube Studio Audio Library"
      mood: "warm_lifestyle"
      use_for: ["food", "daily_habits", "movement_light"]
      default_volume_db_below_voice: 22
    shorts_sleep_stress:
      file: "assets/music/floating_home_brian_bolger.mp3"
      title: "Floating Home"
      artist: "Brian Bolger"
      source: "YouTube Studio Audio Library"
      mood: "calm_wellness"
      use_for: ["sleep", "stress", "calm", "mental_load", "energy", "menopause"]
      default_volume_db_below_voice: 15
    shorts_deep_calm:
      file: "assets/music/ether_silent_partner.mp3"
      title: "Ether"
      artist: "Silent Partner"
      source: "YouTube Studio Audio Library"
      mood: "reflective_sleep"
      use_for: ["sleep_deep", "reflective", "night"]
      default_volume_db_below_voice: 18
