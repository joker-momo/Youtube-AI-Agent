schema_version: "3.0-mvp"
channel:
  id: "vida-plena-45"
  name: "Vida Plena 45+"
  youtube_channel_id: "UCKUswqsAaLsEkcsgzTuKAmw"
  description: "Salud y bienestar práctico para personas de más de 45 años."
audience:
  language: "es-ES"
  age_range: [45, 75]
  primary_markets: ["ES"]
  secondary_markets: ["MX", "CO", "AR", "CL", "PE"]
locale_style:
  target_locale: "Spain"
  language_code: "es-ES"
  timezone: "Europe/Madrid"
  lexical_preferences:
    prefer:
      - "móvil"
      - "ordenador"
      - "por la tarde"
      - "de madrugada"
      - "hábitos sencillos"
      - "personas de más de 45 años"
    avoid:
      - "celular"
      - "computadora"
      - "LatAm"
      - "adultos mayores"
      - "tercera edad"
      - "ancianos"
      - "abuelitos"
niche:
  category: "health_wellness"
  sub_niches:
    - "nutrition_45plus"
    - "exercise_low_impact"
    - "sleep_quality"
  avoid_topics:
    - "specific_medical_diagnoses"
    - "supplement_promotion"
    - "miracle_cures"
brand_voice_path: "configs/vida-plena-45/brand-voice.md"
style_dna:
  path: "configs/vida-plena-45/style-dna.json"
  current_version: "mvp-v1"
personas:
  - id: "maria"
    profile_path: "configs/vida-plena-45/personas/maria.md"
    weight: 1.0
  - id: "carlos"
    profile_path: "configs/vida-plena-45/personas/carlos.md"
    weight: 1.0
  - id: "rosa"
    profile_path: "configs/vida-plena-45/personas/rosa.md"
    weight: 1.0
content_format:
  type: "long_form"
  target_duration_sec: 840        # 14 min sweet spot — top Spanish health channel benchmark
  duration_sec_min: 720           # 12 min hard floor
  duration_sec_max: 900           # 15 min hard ceiling
  scenes_count_min: 40            # 40-55 scenes × 15-20s = 10-18 min, high visual variety
  scenes_count_max: 55
  publish_schedule:
    cadence: "3 per week"
    days: ["Monday", "Wednesday", "Friday"]
    time_local: "20:00"
    timezone: "Europe/Madrid"

qa_rules:
  script_path: "configs/vida-plena-45/qa-rules/script.yaml"
  scene_path: "configs/vida-plena-45/qa-rules/scene.yaml"
  asset_path: "configs/vida-plena-45/qa-rules/asset.yaml"
  thresholds:
    max_retry_per_qa: 3
    max_average_sentence_words: 20
    max_thumbnail_words: 6
positioning:
  forbidden_phrases:
    - "adultos mayores"
    - "tercera edad"
    - "ancianos"
    - "personas mayores"
    - "abuelos"
    - "abuelitos"
  preferred_phrases:
    - "personas de más de 45 años"
    - "adultos 45+"
    - "mediana edad"
    - "bienestar práctico"
research_gate:
  # vidIQ free tier scores Spanish long-tail phrases lower than English.
  # Calibrated to 20 after observing that "insomnio" (short keyword) = 63
  # while "Insomnio despues de los 45..." (long phrase) = 26.
  # Topics with best_score >= 20 have real search presence; null scores
  # (not enough data) are allowed through (verdict=pass).
  min_score: 20
  max_competition: "High"
  min_tag_score: 20

seo:
  language: "es-ES"
  min_tags: 5
  max_tags: 8
domain_plugins:
  - name: "medical_safety_checker"
    enabled: true
models:
  default: "mock-local"
tts:
  provider: "kokoro"
  voice_id: "ef_dora"
  lang_code: "e"
  speed: 0.97
  sample_rate: 24000
  pace_wpm: 145
  scene_lead_in_sec: 0.6
  humanize:
    enabled: true
    pause_comma_ms: 300
    pause_semicolon_ms: 450
    pause_sentence_ms: 650
    pause_paragraph_ms: 900
    speed_jitter_pct: 3.0
visuals:
  strategy: "auto"
  source_dir: "asset_library/source"
  providers: ["pexels_video"]
  fallback_providers: ["pexels"]
  query_cache_ttl_hours: 24
  orientation: "landscape"
  per_page: 10
  scene_count_target: 5
music:
  source: "asset_library"
  preferred_track: "No.6 In My Dreams - Esther Abrami.mp3"
  voice_gain_db: -4.5
  level_db: -24
  duck_db: 8
  target_lufs: -13.6
  target_tp_dbtp: 0.0
  target_lra: 4.8
  sample_rate: 44100
  bitrate: "128k"
  stereo: true
render:
  composition: "ChannelVideoStandard"
  resolution: "1920x1080"
  fps: 30
  codec: "h264"
  # Bitrate-based encoding lets VideoToolbox HW encoder kick in (CRF mode forces software libx264).
  video_bitrate: "12M"
  # Use Metal-backed ANGLE so Chromium WebGL composites on GPU instead of CPU.
  gl: "angle"
  concurrency: "auto"
  subtitles:
    enabled: true
    mode: "word_highlight"
    words_per_page: 10
    max_lines: 2
    position: "bottom"
    offset_sec: 0
    font_size: 54
    active_scale: 1.08
    background_opacity: 0.58
  audio_loudness:
    enabled: true
    integrated_lufs: -14
    true_peak_dbtp: -1
    lra: 11
upload:
  ai_disclosure: true
  default_privacy: "manual_upload_only"
budget:
  max_cost_per_video_usd: 0
