networks:
  appliance_net:
    driver: bridge

services:
  video-agent:
    build: .
    working_dir: /app
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
    volumes:
      - ./jobs:/app/jobs
      - ./caches:/app/caches
      - ./asset_library:/app/asset_library
      - ./configs:/app/configs
      - ./src:/app/src
    command:
      - python
      - -m
      - video_agent.cli
      - run
      - --channel
      - configs/vida-plena-45/channel.yaml
      - --idea
      - inputs/manual_idea.json

  app:
    build: .
    working_dir: /app
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      BROWSER_WORKER_URL: http://browser-worker:8001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./jobs:/app/jobs
      - ./caches:/app/caches
      - ./asset_library:/app/asset_library
      - ./configs:/app/configs
      - ./src:/app/src
      - ./tests:/app/tests
      - ./remotion/src:/app/remotion/src
    networks:
      - appliance_net
    command:
      - uvicorn
      - video_agent.web.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  worker:
    build: .
    working_dir: /app
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      BROWSER_WORKER_URL: http://browser-worker:8001
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      JOBS_DIR: /app/jobs
      CHANNEL_CONFIG: /app/configs/vida-plena-45/channel.yaml
    volumes:
      - ./jobs:/app/jobs
      - ./caches:/app/caches
      - ./asset_library:/app/asset_library
      - ./configs:/app/configs
      - ./src:/app/src
      - ./tests:/app/tests
      - ./remotion/src:/app/remotion/src
    networks:
      - appliance_net
    depends_on:
      - browser-worker
    command:
      - python
      - -m
      - video_agent.cli
      - worker
      - --db-path
      - /app/jobs/queue.db

  browser-runtime:
    build:
      context: .
      dockerfile: docker/browser-runtime/Dockerfile
    shm_size: "2gb"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      CHROME_PROFILE_DIR: /data/profile
      CHROME_CDP_PORT: "9222"
    volumes:
      - ./browser_profiles/default:/data/profile
    ports:
      # KasmVNC websocket/UI bound to localhost only — never expose the LAN.
      - "127.0.0.1:7900:7900"
    networks:
      - appliance_net
    # CDP port 9222 stays unpublished; reachable only via the
    # appliance_net Docker network from browser-worker.

  browser-worker:
    build: .
    working_dir: /app
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # browser-worker talks to the runtime container over the internal
      # Docker network. No host Chrome, no host.docker.internal hop.
      CHROME_CDP_URL: ${CHROME_CDP_URL:-http://browser-runtime:9222}
      BROWSER_TRACE_DIR: /data/trace
    volumes:
      - ./browser_trace:/data/trace
      # jobs/ is shared with app so ChatGPT-generated assets can be
      # written directly to /app/jobs/<id>/assets/ from the worker.
      - ./jobs:/app/jobs
      - ./configs:/app/configs
      - ./src:/app/src
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - appliance_net
    depends_on:
      - browser-runtime
    command:
      - uvicorn
      - video_agent.browser_worker.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
