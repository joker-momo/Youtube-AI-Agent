[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1366x768x24 -ac +extension RANDR
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:fluxbox]
environment=DISPLAY=":99",HOME="/home/pwuser",USER="pwuser"
command=/usr/bin/fluxbox
user=pwuser
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox.err

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -nopw -forever -shared -rfbport 5900 -listen 0.0.0.0
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.err

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 7900 127.0.0.1:5900
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.err

[program:cdp-forwarder]
command=/usr/bin/socat TCP-LISTEN:9222,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:9223
autorestart=true
startretries=20
priority=45
stdout_logfile=/var/log/supervisor/socat.log
stderr_logfile=/var/log/supervisor/socat.err

[program:chromium]
environment=DISPLAY=":99",HOME="/home/pwuser",USER="pwuser"
command=/usr/local/bin/launch-chromium.sh
user=pwuser
autorestart=true
startretries=10
priority=50
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err
