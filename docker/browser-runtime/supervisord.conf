[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:kasmvnc]
environment=DISPLAY=":1",HOME="/home/pwuser",USER="pwuser"
command=/usr/local/bin/start-kasmvnc.sh
user=pwuser
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/kasmvnc.log
stderr_logfile=/var/log/supervisor/kasmvnc.err

[program:cdp-forwarder]
command=/usr/bin/socat TCP-LISTEN:9222,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:9223
autorestart=true
startretries=20
priority=40
stdout_logfile=/var/log/supervisor/socat.log
stderr_logfile=/var/log/supervisor/socat.err

[program:chromium]
environment=DISPLAY=":1",HOME="/home/pwuser",USER="pwuser"
command=/usr/local/bin/launch-chromium.sh
user=pwuser
autorestart=true
startretries=10
# Chromium waits for X in launch-chromium.sh, so a real launch stays up.
# startsecs marks it RUNNING only after 8s, resetting the retry counter and
# preventing a transient X delay from burning the budget into FATAL.
startsecs=8
stopwaitsecs=10
priority=45
stdout_logfile=/var/log/supervisor/chromium.log
stderr_logfile=/var/log/supervisor/chromium.err
