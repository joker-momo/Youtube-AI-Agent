[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-ai-agent"
version = "0.1.0"
description = "Local MVP video agent that renders YouTube-ready artifacts with Remotion."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn==0.47.0",
  "httpx==0.28.1",
  "python-telegram-bot==22.7",
  "jsonschema==4.26.0",
  "kokoro==0.9.4",
  "numpy==2.4.6",
  "PyYAML==6.0.3",
  "defusedxml==0.7.1",
  "Pillow==12.2.0",
  "playwright==1.60.0",
  "soundfile==0.13.1",
  "openai-whisper==20250625",
  "torch==2.5.1",
  "websockets==16.0",
  "headroom-ai>=0.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
video-agent = "video_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Single tool for PEP 8 lint + black-style format + import sorting.
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/youtube_ai_agent.egg-info"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
# E501 (line length): ~1.2k pre-existing violations (long prompt/URL literals).
# Tracked as debt and fixed incrementally rather than mass-reflowed.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
