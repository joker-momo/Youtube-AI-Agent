function _formatSyncedAt(iso) {
  // Use the centralised dd/MM/yyyy formatter so every timestamp in the
  // dashboard reads the same way regardless of the operator's locale.
  return iso ? fmtTime(iso) : '';
}

function _renderChannelVideos(payload) {
  const listEl = document.getElementById('channel-videos-list');
  const statusEl = document.getElementById('channel-videos-status');
  const linkEl = document.getElementById('channel-videos-open-link');
  if (payload.channel_url) {
    linkEl.href = payload.channel_url;
    linkEl.style.display = '';
  } else {
    linkEl.style.display = 'none';
  }
  // Newest first, regardless of how the cache was written. Backend sorts
  // already, but a defensive client-side sort means an older cache file
  // still renders in the right order after upgrade.
  const videos = (payload.videos || []).slice().sort((a, b) => {
    const da = String(a && a.published || '');
    const db = String(b && b.published || '');
    if (da === db) return 0;
    return da > db ? -1 : 1;
  });
  if (videos.length === 0) {
    listEl.innerHTML = `
      <div style="text-align:center;padding:24px 16px;border:1px dashed var(--line-strong);border-radius:8px;background:#fafbfc;color:var(--muted);font-size:13px">
        <div style="font-size:28px;line-height:1;margin-bottom:8px">📭</div>
        <div>No cached videos yet.</div>
        <div style="margin-top:4px;font-size:12px">Click <strong>🔄 Sync from YouTube</strong> to fetch the latest published list.</div>
      </div>`;
    statusEl.textContent = payload.synced_at ? `Last synced: ${_formatSyncedAt(payload.synced_at)}` : '';
    return;
  }
  const rows = videos.map((v, idx) => {
    const vid = String(v.id || '');
    const title = String(v.title || '(untitled)');
    const published = v.published ? fmtDate(v.published) : '';
    const views = (typeof v.views === 'number' && v.views >= 0) ? _formatViews(v.views) : null;
    const url = (v.url && String(v.url)) || (vid ? `https://www.youtube.com/watch?v=${encodeURIComponent(vid)}` : '#');
    const thumb = vid ? `https://i.ytimg.com/vi/${encodeURIComponent(vid)}/mqdefault.jpg` : '';
    const rating = (typeof v.rating_average === 'number' && v.rating_average > 0) ? v.rating_average : null;
    const ratingCount = (typeof v.rating_count === 'number' && v.rating_count > 0) ? v.rating_count : null;
    const description = (v.description && String(v.description).trim()) || '';
    const subParts = [];
    if (views !== null) {
      subParts.push(`<span class="cv-views" title="View count from YouTube RSS">👁 ${escapeHtml(views)} views</span>`);
    }
    if (rating !== null) {
      const ratingLabel = `⭐ ${rating.toFixed(1)}` + (ratingCount ? ` (${ratingCount})` : '');
      subParts.push(`<span class="cv-rating" title="Public star rating from YouTube RSS (0-5 scale)">${escapeHtml(ratingLabel)}</span>`);
    }
    if (published) subParts.push(`<span class="cv-date">${escapeHtml(published)}</span>`);
    const sub = subParts.length
      ? subParts.join('<span class="cv-dot">·</span>')
      : '';
    // Title tooltip combines the literal title and the first ~280 chars of
    // the description so the operator can hover for context without
    // opening YouTube.
    const titleTooltip = description
      ? `${title}\n\n${description.slice(0, 280)}${description.length > 280 ? '…' : ''}`
      : title;
    return `
      <div class="channel-video-row">
        <div class="cv-idx">${idx + 1}</div>
        ${thumb ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" class="cv-thumb"><img loading="lazy" src="${escapeHtml(thumb)}" alt=""></a>` : ''}
        <div class="cv-meta">
          <a class="cv-title" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="${escapeHtml(titleTooltip)}">${escapeHtml(title)}</a>
          ${sub ? `<div class="cv-sub">${sub}</div>` : ''}
        </div>
        <a class="action-btn primary" href="${escapeHtml(url)}" target="_blank" rel="noopener">▶ Open</a>
      </div>
    `;
  });
  listEl.innerHTML = rows.join('');
  statusEl.textContent = `${videos.length} video${videos.length === 1 ? '' : 's'} · last synced ${_formatSyncedAt(payload.synced_at) || 'never'}`;
}

function _formatViews(n) {
  if (n < 1000) return String(n);
  if (n < 1_000_000) return (n / 1000).toFixed(n < 10_000 ? 1 : 0).replace(/\.0$/, '') + 'K';
  if (n < 1_000_000_000) return (n / 1_000_000).toFixed(n < 10_000_000 ? 1 : 0).replace(/\.0$/, '') + 'M';
  return (n / 1_000_000_000).toFixed(1).replace(/\.0$/, '') + 'B';
}

async function generateAndScore() {
  const channelId = document.getElementById('idea-channel').value;
  const count = parseInt(document.getElementById('idea-count').value, 10) || 5;
  const seedRaw = document.getElementById('seed-topics').value.trim();
  const seedTopics = seedRaw ? seedRaw.split('\\n').map(s => s.trim()).filter(Boolean) : [];
  const btn = document.getElementById('gen-btn');
  const status = document.getElementById('ideas-status');

  btn.disabled = true;
  document.getElementById('ideas-grid').innerHTML = '';

  // Single request: backend analyzes seed keywords, then asks ChatGPT for ideas.
  btn.innerHTML = '<span class="spinner-inline"></span>Analyzing keywords…';
  status.textContent = 'Step 1/2 — analyzing seed keywords for channel fit…';

  let ideas = [], savedPaths = [];
  try {
    const r = await fetch('/channels/' + encodeURIComponent(channelId) + '/ideas/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({count, seed_topics: seedTopics}),
    });

    // While waiting, update label to hint that ChatGPT phase started
    // (we can't stream, so just show a generic second step message after short delay)
    const labelTimer = setTimeout(() => {
      if (btn.disabled) {
        btn.innerHTML = '<span class="spinner-inline"></span>Generating ideas…';
        status.textContent = 'Step 2/2 — ChatGPT generating ideas from top keywords…';
      }
    }, 30000);

    const d = await r.json();
    clearTimeout(labelTimer);

    if (!r.ok) {
      status.textContent = '❌ Failed: ' + (d.detail?.error || d.detail || r.status);
      return;
    }
    ideas = d.ideas || [];
    savedPaths = (d.saved || []).map(p => 'ideas/' + p.split('ideas/').pop());

    // Ideas already include local keyword-fit metadata from the backend.
    renderIdeaCards(ideas, savedPaths);

    const topKws = d.top_keywords || [];
    const best = topKws.length ? ' (best: ' + (topKws[0].score ?? '?') + '/100)' : '';
    const srcLabel = {'trend': '📈 từ Google Trends', 'fallback': '📂 từ channel niche', 'user': '✏️ từ seeds bạn nhập'}[d.seed_source] || '';
    status.textContent = '✅ ' + ideas.length + ' ideas — ' + srcLabel + best + '.';
  } catch (e) {
    status.textContent = '❌ Error: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✨ Generate + Score';
  }
}

async function clearSavedIdeas() {

  if (!channelId) return;
  if (!confirm(`Delete ALL saved ideas for ${channelId}? This removes the JSON files under inputs/ideas/${channelId}/ and cannot be undone.`)) {
    return;
  }
  const btn = document.getElementById('clear-saved-btn');
  const status = document.getElementById('ideas-status');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span>Clearing…';
  try {
    const r = await fetch('/channels/' + encodeURIComponent(channelId) + '/ideas', {method: 'DELETE'});
    const d = await r.json();
    if (!r.ok) {
      status.textContent = '❌ Clear failed: ' + (d.detail || r.status);
      return;
    }
    document.getElementById('ideas-grid').innerHTML = '';
    _CURRENT_IDEAS = [];
    _CURRENT_PATHS = [];
    status.textContent = `🗑 Removed ${d.deleted} saved idea${d.deleted === 1 ? '' : 's'}.`;
  } catch (e) {
    status.textContent = '❌ Clear error: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '🗑 Clear saved';
  }
}

function renderIdeaCards(ideas, paths) {
  _CURRENT_IDEAS = ideas;
  _CURRENT_PATHS = paths;
  const grid = document.getElementById('ideas-grid');
  grid.innerHTML = '';
  ideas.forEach((idea, i) => {
    const el = document.createElement('div');
    el.innerHTML = renderIdeaCard(idea, paths[i] || '');
    el.firstElementChild.id = 'idea-card-' + i;
    grid.appendChild(el.firstElementChild);
  });
}

function _scoreClass(n) {
  if (n == null) return 'none';
  if (n >= 50) return 'high';
  if (n >= 25) return 'mid';
  return 'low';
}

function _scoreColor(n) {
  if (n == null) return '#9ca3af';
  if (n >= 50) return '#10b981';
  if (n >= 25) return '#f59e0b';
  return '#ef4444';
}

async function scoreOneIdea(btn, idea) {
  const card = btn.closest('.idea-card');
  const mount = card ? card.querySelector('.idea-score-mount') : null;
  if (!mount) return;
  const channelId = document.getElementById('idea-channel').value;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span>';
  try {
    const r = await fetch('/channels/' + encodeURIComponent(channelId) + '/ideas/score', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ideas: [idea]}),
    });
    const d = await r.json();
    const res = (d.results || [])[0];
    mount.innerHTML = res ? renderIdeaScoreBlock(res) : '<div style="font-size:11px;color:var(--muted)">No data</div>';
  } catch (e) {
    mount.innerHTML = '<div style="font-size:11px;color:var(--red)">' + escapeHtml(e.message) + '</div>';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '📊';
  }
}

function renderIdeaScoreBlock(res) {
  if (!res) return '';
  const n = res.best_score;
  const finalScore = res.keyword_final_score ?? res.final_score ?? null;
  const cls = _scoreClass(n);
  const color = _scoreColor(n);
  const pct = n != null ? Math.min(n, 100) : 0;
  const comp = res.competition ? `<span class="idea-comp-badge">⚔️ ${escapeHtml(res.competition)}</span>` : '';
  const bucket = res.bucket ? `<span class="idea-bucket-badge">${escapeHtml(bucketLabel(res.bucket))}</span>` : '';
  const related = (res.related || [])
    .filter(r => !isBlockedKeywordLabel(r))
    .slice(0, 6)
    .map(r => `<span style="background:#f3f4f6;border-radius:4px;padding:1px 7px;font-size:11px">${escapeHtml(r)}</span>`)
    .join(' ');
  const err = res.error ? `<div style="font-size:11px;color:var(--muted)">Keyword analysis unavailable</div>` : '';
  return `
    <div class="idea-score-row">
      <span class="idea-score-badge ${cls}">${finalScore != null ? 'Final ' + finalScore + '/100' : (n != null ? n + '/100' : 'N/A')}</span>
      <div class="idea-score-bar"><div class="idea-score-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      ${comp}
      ${bucket}
    </div>
    ${related ? `<div class="idea-related">Related: ${related}</div>` : ''}
    ${err}
  `;
}

function bucketLabel(bucket) {
  const labels = {
    top_opportunity_keywords: 'Top opportunity',
    long_tail_test_keywords: 'Long-tail test',
    rejected_keywords: 'Rejected',
  };
  return labels[bucket] || String(bucket || '').replaceAll('_', ' ');
}

function renderIdeaCard(idea, savedPath) {
  const dur = idea.target_duration_sec ? Math.round(idea.target_duration_sec / 60) + ' min' : '';
  const points = (idea.key_points || []).slice(0, 4).map(p => `<li>${escapeHtml(p)}</li>`).join('');
  const safeIdea = escapeHtml(JSON.stringify(idea));
  const safePath = escapeHtml(savedPath);

  // Inline score block from pre-computed local keyword analysis.
  const finalScore = idea.keyword_final_score ?? null;
  const sourceScore = idea.keyword_source_score ?? null;
  const kw = idea.target_keyword || '';
  const bucket = idea.bucket || '';
  const cluster = idea.intent_cluster || '';
  const hooks = Array.isArray(idea.thumbnail_hook_options) ? idea.thumbnail_hook_options : [];
  const audienceFit = idea.audience_fit ?? null;
  const intentStrength = idea.intent_strength ?? null;
  const contentFit = idea.content_fit ?? null;
  let scoreHtml = '';
  if (finalScore !== null || sourceScore !== null || kw || bucket || cluster) {
    const mainScore = finalScore ?? sourceScore;
    const cls = _scoreClass(mainScore);
    const color = _scoreColor(mainScore);
    const pct = mainScore != null ? Math.min(100, mainScore) : 0;
    const metric = (label, value) => value == null ? '' : `<div class="idea-v2-metric"><span>${label}</span><b>${escapeHtml(String(value))}/100</b></div>`;
    scoreHtml = `
      <div class="idea-score-row">
        ${mainScore !== null ? `<span class="idea-score-badge ${cls}">Final ${mainScore}/100</span>` : ''}
        ${mainScore !== null ? `<div class="idea-score-bar"><div class="idea-score-bar-fill" style="width:${pct}%;background:${color}"></div></div>` : ''}
        ${bucket ? `<span class="idea-bucket-badge">${escapeHtml(bucketLabel(bucket))}</span>` : ''}
      </div>
      ${kw ? `<div class="idea-related" style="margin-top:4px">🔑 <b>${escapeHtml(kw)}</b>${cluster ? ' · ' + escapeHtml(cluster) : ''}</div>` : ''}
      ${(audienceFit !== null || intentStrength !== null || contentFit !== null) ? `<div class="idea-v2-metrics">${metric('Audience', audienceFit)}${metric('Intent', intentStrength)}${metric('Content', contentFit)}</div>` : ''}
      ${hooks.length ? `<div class="idea-hook-list">${hooks.slice(0, 5).map(h => `<span class="idea-hook-chip">${escapeHtml(h)}</span>`).join('')}</div>` : ''}`;
  }

  const dupHtml = idea.is_duplicate
    ? `<div class="idea-duplicate-badge">⚠️ Trùng nội dung: "${escapeHtml((idea.duplicate_of || '').slice(0, 60))}"</div>`
    : '';

  return `
    <div class="idea-card${idea.is_duplicate ? ' opacity-60' : ''}">
      <div class="idea-card-title">${escapeHtml(idea.title_seed || idea.topic || '-')}</div>
      ${dupHtml}
      ${scoreHtml}
      <div class="idea-card-angle">${escapeHtml(idea.angle || '')}</div>
      <div class="idea-card-meta">
        ${dur ? `<span class="idea-card-dur">⏱ ${dur}</span>` : ''}
        <span class="idea-card-dur">${escapeHtml(idea.topic || '')}</span>
      </div>
      ${points ? `<ul class="idea-card-points">${points}</ul>` : ''}
      <div class="idea-card-actions">
        <button class="action-btn primary"
          ${idea.is_duplicate ? 'disabled' : ''}
          title="${idea.is_duplicate ? 'Idea trùng video đã làm' : 'Run job từ idea này'}"
          onclick='createJobFromIdea(${safeIdea}, "${safePath}")'>Run Job</button>
      </div>
    </div>`;
}

async function createJobFromIdea(idea, savedPath) {
  const channelId = document.getElementById('idea-channel').value;
  try {
    const r = await fetch('/jobs/from-idea', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        channel_id: channelId,
        idea,
        run_now: true,
        duplicate_policy: 'block',
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      showToast('Create job failed: ' + endpointErrorMessage(d, 'HTTP ' + r.status));
      return;
    }
    const jobId = d.job_id;
    showToast('Job created — ' + (d.pipeline_status || 'queued'));
    await fetchJobs();
    SELECTED_ID = jobId;
    LAST_TIMELINE_JSON = '';
    await fetchTimeline(jobId);
  } catch (e) {
    showToast('Error: ' + e.message);
  }
}
// ---- end Idea Generator ----
</script>
</body>
