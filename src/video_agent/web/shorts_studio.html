function scoreColor(n) {
  if (n === null || n === undefined) return '#9ca3af';
  if (n >= 60) return '#16a34a';
  if (n >= 35) return '#d97706';
  return '#dc2626';
}

function isBlockedKeywordLabel(value) {
  const text = String(value || '').trim().toLowerCase();
  return [
    'best camera settings',
    'weight loss',
    'sleep tips',
    'morning routine',
    'diet plan',
    'workout routine',
    'healthy aging',
  ].includes(text);
}

function renderResearchInsight(data) {
  const scores = Array.isArray(data.scores) ? data.scores : [];
  const verdict = (data.verdict || '').toLowerCase();
  const vbCls = verdict === 'pass' ? 'vb-pass' : verdict === 'skipped' ? 'vb-skip' : 'vb-block';
  const vbIcon = verdict === 'pass' ? '✅' : verdict === 'skipped' ? '⏭' : '❌';
  const vbLabel = verdict === 'pass' ? 'Research recorded' : verdict === 'skipped' ? 'Skipped' : 'Blocked';
  const scoreRows = scores.slice(0, 8).map(s => {
    const n = s.score ?? 0;
    const pct = Math.min(100, Math.round((n / 100) * 100));
    const related = Array.isArray(s.related)
      ? s.related
          .map(r => r.keyword || r.term || r || '')
          .filter(r => !isBlockedKeywordLabel(r))
          .slice(0, 3)
          .map(r => `<span class="tag-chip">${escapeHtml(r)}</span>`)
          .join('')
      : '';
    return `
      <div class="score-row">
        <span class="score-kw" title="${escapeHtml(s.keyword || '')}">${escapeHtml(s.keyword || '')}</span>
        <div class="score-bar-outer"><div class="score-bar-inner" style="width:${pct}%;background:${scoreColor(n)}"></div></div>
        <span class="score-num" style="color:${scoreColor(n)}">${n}</span>
        <span class="score-meta">${escapeHtml(s.volume || '')} / ${escapeHtml(s.competition || '')}</span>
      </div>
      ${related ? `<div style="padding-left:148px;margin-bottom:2px">${related}</div>` : ''}
    `;
  }).join('');
  const gateTxt = data.gate ? `Min: ${data.gate.min_score ?? '-'}` : '';
  return `
    <div class="insight">
      <div class="vb ${vbCls}">${vbIcon} ${escapeHtml(vbLabel)}</div>
      <div class="insight-grid">
        <div class="insight-kv"><b>Best keyword score:</b><span style="font-weight:700;color:${scoreColor(data.best_score)}">${data.best_score ?? '-'}/100</span></div>
        <div class="insight-kv"><b>Gate threshold:</b>${escapeHtml(gateTxt || '-')}</div>
      </div>
      ${data.block_reason ? `<div class="gate-note" style="margin-top:8px">⚠️ ${escapeHtml(data.block_reason)}</div>` : ''}
      ${scoreRows ? `<div class="insight-section">Keyword scores</div>${scoreRows}` : ''}
    </div>
  `;
}

function renderScriptInsight(data) {
  const sections = Array.isArray(data.sections) ? data.sections : [];
  const narration = data.narration || '';
  const wordCount = narration.trim() ? narration.trim().split(/\s+/).length : 0;
  const estSec = Math.round(wordCount / 145 * 60);
  const sectionItems = sections.map(s => `
    <div class="section-item">
      <div class="section-title">${escapeHtml(s.title || '')}</div>
      <div class="section-text">${escapeHtml((s.text || '').slice(0, 200))}</div>
    </div>
  `).join('');
  return `
    <div class="insight">
      ${data.hook ? `<div class="insight-section">Hook</div><div class="hook-box">${escapeHtml(data.hook)}</div>` : ''}
      <div class="insight-grid" style="margin-top:10px">
        <div class="insight-kv"><b>Sections:</b>${sections.length}</div>
        <div class="insight-kv"><b>Words:</b>${wordCount} (~${estSec}s)</div>
      </div>
      ${sectionItems ? `<div class="insight-section">Sections</div>${sectionItems}` : ''}
      ${narration ? `<div class="insight-section">Full narration</div><div class="narration-box">${escapeHtml(narration)}</div>` : ''}
      ${data.cta ? `<div class="insight-section">Call to action</div><div class="cta-box">📣 ${escapeHtml(data.cta)}</div>` : ''}
    </div>
  `;
}

function renderScenesInsight(data) {
  const scenes = Array.isArray(data.scenes) ? data.scenes : [];
  const total = data.total_duration_sec;
  const sceneCards = scenes.map(s => `
    <div class="scene-card">
      <div class="scene-card-head">
        <span>${escapeHtml(s.id || '')}</span>
        <span class="scene-dur-badge">⏱ ${s.duration_sec ?? '-'}s</span>
      </div>
      ${s.on_screen_text ? `<div class="scene-text">🖼 ${escapeHtml(s.on_screen_text)}</div>` : ''}
      <div class="scene-narration">${escapeHtml((s.narration || '').slice(0, 220))}</div>
      ${s.visual_prompt ? `<div class="scene-prompt">🎨 ${escapeHtml((s.visual_prompt || '').slice(0, 120))}</div>` : ''}
    </div>
  `).join('');
  return `
    <div class="insight">
      <div class="insight-grid">
        <div class="insight-kv"><b>Total duration:</b><span style="font-weight:700">${total ?? '-'}s</span></div>
        <div class="insight-kv"><b>Scenes:</b>${scenes.length}</div>
      </div>
      ${sceneCards}
    </div>
  `;
}

function renderSeoInsight(data) {
  const tags = Array.isArray(data.tags) ? data.tags : [];
  const variants = Array.isArray(data.title_variants) ? data.title_variants : [];
  const tagChips = tags.map(t => `<span class="tag-chip">#${escapeHtml(t)}</span>`).join('');
  let variantHtml = '';
  if (variants.length) {
    variantHtml = `<div class="insight-section">Title & thumbnail variants (A/B)</div>` +
      variants.map((v, i) => {
        const isWinner = i === 0;
        return `
          <div class="variant-card${isWinner ? ' winner' : ''}">
            ${isWinner ? '<span class="variant-winner-badge">⭐ Winner</span>' : ''}
            <span class="variant-score">${v.score ?? '-'}</span>
            <div class="variant-title">${escapeHtml(v.title || '-')}</div>
            <div class="variant-hook">📌 ${escapeHtml(v.thumbnail_text || '-')}</div>
          </div>
        `;
      }).join('');
  }
  return `
    <div class="insight">
      <div class="hook-box" style="font-size:17px">${escapeHtml(data.title || '-')}</div>
      <div class="insight-grid">
        <div class="insight-kv"><b>Language:</b>${escapeHtml(data.language || '-')}</div>
        <div class="insight-kv"><b>Thumbnail hook:</b>${escapeHtml(data.thumbnail_text || '-')}</div>
      </div>
      ${data.description ? `<div class="insight-section">Description</div><div class="description-box">${escapeHtml(data.description)}</div>` : ''}
      ${tagChips ? `<div class="insight-section">Tags</div><div class="tag-chips">${tagChips}</div>` : ''}
      ${variantHtml}
    </div>
  `;
}

function renderQaInsight(data) {
  const verdict = (data.verdict || '').toUpperCase();
  const isPass = verdict === 'PASS';
  const vbCls = isPass ? 'vb-pass' : 'vb-fail';
  const icon = isPass ? '✅' : '❌';
  const issues = Array.isArray(data.issues) ? data.issues : [];
  const changes = Array.isArray(data.required_changes) ? data.required_changes : [];
  const scores = data.scores && typeof data.scores === 'object' ? data.scores : {};
  const scoreEntries = Object.entries(scores);

  // YouTube Policy block
  const policy = data.youtube_policy && typeof data.youtube_policy === 'object' ? data.youtube_policy : null;
  const policyCompliant = policy ? policy.compliant : null;
  const policyRisk = policy ? (policy.risk_level || 'unknown') : 'unknown';
  const policyViolations = policy && Array.isArray(policy.violations) ? policy.violations : [];
  const policyIcon = policyCompliant === true ? '✅' : policyCompliant === false ? '🚫' : '⚠️';
  const policyColor = policyCompliant === true ? '#16a34a' : policyCompliant === false ? '#dc2626' : '#d97706';
  const policyBg = policyCompliant === true ? '#f0fdf4' : policyCompliant === false ? '#fef2f2' : '#fffbeb';
  const riskBadgeColor = {none:'#16a34a',low:'#ca8a04',medium:'#ea580c',high:'#dc2626'}[policyRisk] || '#6b7280';
  const policyBlock = `
    <div style="border:2px solid ${policyColor};border-radius:8px;background:${policyBg};padding:10px 12px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:${policyViolations.length ? '8px' : '0'}">
        <span style="font-size:15px">${policyIcon}</span>
        <span style="font-weight:700;color:${policyColor};font-size:13px">YouTube Policy</span>
        <span style="margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:${riskBadgeColor};padding:2px 7px;border-radius:10px">${policyRisk.toUpperCase()} RISK</span>
        ${policyCompliant === true ? '<span style="font-size:12px;color:#16a34a">Compliant ✓</span>' : policyCompliant === false ? '<span style="font-size:12px;color:#dc2626;font-weight:700">NOT COMPLIANT</span>' : ''}
      </div>
      ${policyViolations.length ? `<ul style="margin:0;padding-left:16px;font-size:12px;color:#dc2626">${policyViolations.map(v => `<li>${escapeHtml(v)}</li>`).join('')}</ul>` : ''}
    </div>
  `;

  const scoreBars = scoreEntries.map(([k, v]) => {
    const isPolicy = k === 'youtube_policy';
    const pct = Math.min(100, Math.round((Number(v) / 5) * 100));
    const barColor = isPolicy && Number(v) < 5 ? '#dc2626' : scoreColor(Number(v)*20);
    return `
      <div class="score-row">
        <span class="score-kw" style="${isPolicy ? 'font-weight:700' : ''}">${isPolicy ? '🔒 ' : ''}${escapeHtml(k.replace(/_/g,' '))}</span>
        <div class="score-bar-outer"><div class="score-bar-inner" style="width:${pct}%;background:${barColor}"></div></div>
        <span class="score-num" style="${isPolicy && Number(v) < 5 ? 'color:#dc2626;font-weight:700' : ''}">${v}/5</span>
      </div>
    `;
  }).join('');
  return `
    <div class="insight">
      <div class="vb ${vbCls}">${icon} ${escapeHtml(verdict)}</div>
      ${policyBlock}
      ${scoreBars ? `<div class="insight-section">Scores</div>${scoreBars}` : ''}
      ${issues.length ? `<div class="insight-section">Issues</div><ul class="insight-list">${issues.slice(0, 8).map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>` : ''}
      ${changes.length ? `<div class="insight-section">Required changes</div><ul class="insight-list">${changes.slice(0, 6).map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>` : ''}
    </div>
  `;
}

function toShortText(v) {
  if (v === null || v === undefined) return '-';
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (typeof v === 'number') return String(v);
  if (typeof v === 'string') return v.length > 140 ? (v.slice(0, 140) + '…') : v;
  if (Array.isArray(v)) return v.length + ' items';
  if (typeof v === 'object') return Object.keys(v).length + ' fields';
  return String(v);
}

function renderGenericJsonInsight(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) return '';
  const rows = Object.entries(data).slice(0, 10).map(([k, v]) => `
    <div class="insight-kv"><b>${escapeHtml(k)}:</b>${escapeHtml(toShortText(v))}</div>
  `).join('');
  if (!rows) return '';
  return `
    <div class="insight">
      <div class="insight-grid">${rows}</div>
    </div>
  `;
}

async function renderStageExtras(jobId, s) {
  const actions = document.getElementById('actions-' + s.name);
  const insight = document.getElementById('insight-' + s.name);
  if (!actions || !insight) return;
  if (s.name === 'shorts_autopilot') return;
  const hasOutput = (path) => Array.isArray(s.outputs) && s.outputs.some(o => (o.path === path || o.path.endsWith('/' + path)) && o.exists);

  if (isStageApprovalRequired(s.name) && s.status === 'completed') {
    actions.innerHTML = ``;
  }

  try {
    let rendered = false;
    if (s.name === 'idea_research') {
      if (!hasOutput('research.json')) return;
      insight.innerHTML = renderResearchInsight(await fetchArtifactJson(jobId, 'research.json'));
      rendered = true;
    } else if (s.name === 'script_promote') {
      if (!hasOutput('script.json')) return;
      insight.innerHTML = renderScriptInsight(await fetchArtifactJson(jobId, 'script.json'));
      rendered = true;
    } else if (s.name === 'scenes_promote') {
      if (!hasOutput('scenes.json')) return;
      insight.innerHTML = renderScenesInsight(await fetchArtifactJson(jobId, 'scenes.json'));
      rendered = true;
    } else if (s.name === 'seo_promote') {
      if (!hasOutput('seo.json')) return;
      insight.innerHTML = renderSeoInsight(await fetchArtifactJson(jobId, 'seo.json'));
      rendered = true;
    } else if (s.name === 'script_qa') {
      if (!hasOutput('operator/gemini/script_qa.json')) return;
      insight.innerHTML = renderQaInsight(await fetchArtifactJson(jobId, 'operator/gemini/script_qa.json'));
      rendered = true;
    } else if (s.name === 'scenes_qa') {
      if (!hasOutput('operator/gemini/scenes_qa.json')) return;
      insight.innerHTML = renderQaInsight(await fetchArtifactJson(jobId, 'operator/gemini/scenes_qa.json'));
      rendered = true;
    } else if (s.name === 'seo_qa') {
      if (!hasOutput('operator/gemini/seo_qa.json')) return;
      insight.innerHTML = renderQaInsight(await fetchArtifactJson(jobId, 'operator/gemini/seo_qa.json'));
      rendered = true;
    } else if (s.name === 'thumbnail_image') {
      if (!hasOutput('thumbnail_bg.png') && !hasOutput('thumbnail_1.jpg') && !hasOutput('thumbnail_2.jpg') && !hasOutput('thumbnail_3.jpg') && !hasOutput('thumbnail.jpg')) return;
      if (hasOutput('thumbnail_1.jpg') || hasOutput('thumbnail_2.jpg') || hasOutput('thumbnail_3.jpg') || hasOutput('thumbnail.jpg')) {
        let seo = {};
        try {
          if (hasOutput('seo.json')) seo = await fetchArtifactJson(jobId, 'seo.json');
        } catch(e) {}
        const variants = Array.isArray(seo.title_variants) && seo.title_variants.length
          ? seo.title_variants
          : [{title: seo.title || '', thumbnail_text: seo.thumbnail_text || '', score: null}];
        function thumbUrl(idx) {
          return '/jobs/' + encodeURIComponent(jobId) + '/artifact?path=' + encodeURIComponent('thumbnail_' + (idx+1) + '.jpg') + '&t=' + Date.now();
        }
        function fallbackThumb(idx) {
          return '/jobs/' + encodeURIComponent(jobId) + '/artifact?path=thumbnail.jpg' + '&t=' + Date.now();
        }
        const cards = variants.slice(0,3).map((v, i) => {
          const isWinner = i === 0;
          const score = v.score != null ? ` · ${v.score}pt` : '';
          const badge = isWinner ? `⭐ Best${score}` : `Variant ${i+1}${score}`;
          return `
            <div class="ab-card${isWinner?' ab-winner':''}">
              <div class="ab-badge${isWinner?' winner':''}">${badge}</div>
              <img class="thumb-img" src="${thumbUrl(i)}" alt="thumbnail ${i+1}"
                   onerror="this.src='${fallbackThumb(i)}';this.onerror=null">
              <div class="ab-title">${escapeHtml(v.title || '')}</div>
              ${v.thumbnail_text ? `<div class="ab-hook">${escapeHtml(v.thumbnail_text)}</div>` : ''}
              <button class="copy-btn" data-clip="${escapeHtml(v.title||'')}" onclick="copyText(this,this.dataset.clip)">copy title</button>
            </div>`;
        }).join('');
        insight.innerHTML = `<div class="insight"><div class="insight-section">Generated Thumbnails (ChatGPT Image)</div><div class="ab-grid">${cards}</div></div>`;
        rendered = true;
      } else {
        const bgUrl = '/jobs/' + encodeURIComponent(jobId) + '/artifact?path=thumbnail_bg.png';
        insight.innerHTML = `
          <div class="insight">
            <div class="insight-section">Generated thumbnail background</div>
            <img class="thumb-preview" src="${bgUrl}" alt="thumbnail background"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
            <div style="display:none;color:var(--muted);font-size:12px;padding:8px">Image not ready yet</div>
          </div>`;
        rendered = true;
      }
    } else if (s.name === 'render') {
      if (!hasOutput('video.mp4') && !hasOutput('thumbnail.jpg') && !hasOutput('thumbnail_1.jpg')) return;
      // Show all 3 rendered thumbnails + title variants from seo.json
      let seo = {};
      try {
        if (hasOutput('seo.json')) seo = await fetchArtifactJson(jobId, 'seo.json');
      } catch(e) {}
      const variants = Array.isArray(seo.title_variants) && seo.title_variants.length
        ? seo.title_variants
        : [{title: seo.title || '', thumbnail_text: seo.thumbnail_text || '', score: null}];
      function thumbUrl(idx) {
        return '/jobs/' + encodeURIComponent(jobId) + '/artifact?path=' + encodeURIComponent('thumbnail_' + (idx+1) + '.jpg') + '&t=' + Date.now();
      }
      function fallbackThumb(idx) {
        return '/jobs/' + encodeURIComponent(jobId) + '/artifact?path=thumbnail.jpg' + '&t=' + Date.now();
      }
      const cards = variants.slice(0,3).map((v, i) => {
        const isWinner = i === 0;
        const score = v.score != null ? ` · ${v.score}pt` : '';
        const badge = isWinner ? `⭐ Best${score}` : `Variant ${i+1}${score}`;
        return `
          <div class="ab-card${isWinner?' ab-winner':''}">
            <div class="ab-badge${isWinner?' winner':''}">${badge}</div>
            <img class="thumb-img" src="${thumbUrl(i)}" alt="thumbnail ${i+1}"
                 onerror="this.src='${fallbackThumb(i)}';this.onerror=null">
            <div class="ab-title">${escapeHtml(v.title || '')}</div>
            ${v.thumbnail_text ? `<div class="ab-hook">${escapeHtml(v.thumbnail_text)}</div>` : ''}
            <button class="copy-btn" data-clip="${escapeHtml(v.title||'')}" onclick="copyText(this,this.dataset.clip)">copy title</button>
          </div>`;
      }).join('');
      insight.innerHTML = `<div class="insight"><div class="ab-grid">${cards}</div></div>`;
      rendered = true;
    }
    if (!rendered && Array.isArray(s.outputs)) {
      const jsonOutput = s.outputs.find(o => o.exists && /\.json$/i.test(o.path));
      if (jsonOutput) {
        const generic = renderGenericJsonInsight(await fetchArtifactJson(jobId, jsonOutput.path));
        if (generic) insight.innerHTML = generic;
      }
    }
  } catch (e) {
    // If artifact not ready, skip insight quietly.
  }
}

async function confirmStageAndMaybeContinue(jobId, stageName) {
  try {
    await confirmApproval(jobId, stageName);
    showToast((STAGE_LABEL[stageName] || stageName) + ' confirmed');
    LAST_TIMELINE_JSON = '';
    if (SELECTED_ID) {
      await fetchTimeline(SELECTED_ID);
      const nextStage = (LAST_TIMELINE && LAST_TIMELINE.current_stage) ? LAST_TIMELINE.current_stage : null;
      if (nextStage && nextStage !== stageName) {
        await runStage({stopPropagation: () => {}}, jobId, nextStage);
      }
    }
  } catch (e) {
    showToast(e.message || 'Confirm failed');
  }
}

async function clearStageApprovalOnly(jobId, stageName) {
  try {
    await clearApproval(jobId, stageName);
    showToast('Confirmation cleared');
    LAST_TIMELINE_JSON = '';
    if (SELECTED_ID) fetchTimeline(SELECTED_ID);
  } catch (e) {
    showToast(e.message || 'Clear failed');
  }
}

async function regenerateStageAndRun(jobId, stageName) {
  try {
    await regenerateStage(jobId, stageName);
    showToast((STAGE_LABEL[stageName] || stageName) + ' reset. Running again…');
    await runStage({stopPropagation: () => {}}, jobId, executionStageFor(stageName));
  } catch (e) {
    showToast(e.message || 'Regenerate failed');
  }
}

async function renderFinal(t) {
  const mount = document.getElementById('final-mount');
  if (!mount) return;
  const jobId = t.job_id;
  const videoUrl = '/jobs/' + encodeURIComponent(jobId) + '/artifact?path=video.mp4';
  const byName = {};
  for (const st of (t.stages || [])) byName[st.name] = st;
  const stageHas = (stageName, p) => {
    const st = byName[stageName];
    return !!(st && Array.isArray(st.outputs) && st.outputs.some(o => (o.path === p || o.path.endsWith('/' + p)) && o.exists));
  };
  let seo = {};
  if (stageHas('seo_promote', 'seo.json')) {
    try {
      const sr = await fetch('/jobs/' + encodeURIComponent(jobId) + '/artifact?path=seo.json');
      if (sr.ok) seo = await sr.json();
    } catch (e) {}
  }

  // Fetch all 3 QA files to build YouTube Policy summary
  async function fetchQa(name) {
    if (!stageHas(name, 'operator/gemini/' + name + '_qa.json')) return null;
    try {
      const r = await fetch('/jobs/' + encodeURIComponent(jobId) + '/artifact?path=' + encodeURIComponent('operator/gemini/' + name + '_qa.json'));
      return r.ok ? await r.json() : null;
    } catch (e) { return null; }
  }
  const [scriptQa, scenesQa, seoQa] = await Promise.all([fetchQa('script'), fetchQa('scenes'), fetchQa('seo')]);
  const qaAll = [{label:'Script', qa: scriptQa}, {label:'Scenes', qa: scenesQa}, {label:'SEO', qa: seoQa}];
  const policyRows = qaAll.map(({label, qa}) => {
    if (!qa) return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f3f4f6"><span style="width:60px;font-size:12px;font-weight:600;color:#6b7280">${label}</span><span style="font-size:12px;color:#9ca3af">No QA data</span></div>`;
    const p = qa.youtube_policy || {};
    const compliant = p.compliant;
    const risk = (p.risk_level || 'unknown').toUpperCase();
    const violations = Array.isArray(p.violations) ? p.violations : [];
    const icon = compliant === true ? '✅' : compliant === false ? '🚫' : '⚠️';
    const riskColor = {NONE:'#16a34a',LOW:'#ca8a04',MEDIUM:'#ea580c',HIGH:'#dc2626'}[risk] || '#6b7280';
    const vlText = violations.length ? `<div style="font-size:11px;color:#dc2626;margin-top:3px">${violations.map(v => '• ' + escapeHtml(v)).join('<br>')}</div>` : '';
    return `<div style="padding:6px 0;border-bottom:1px solid #f3f4f6">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:60px;font-size:12px;font-weight:700">${label}</span>
        <span style="font-size:14px">${icon}</span>
        <span style="font-size:11px;font-weight:700;color:#fff;background:${riskColor};padding:1px 7px;border-radius:10px">${risk} RISK</span>
        ${compliant === false ? '<span style="font-size:12px;font-weight:700;color:#dc2626">NOT COMPLIANT</span>' : compliant === true ? '<span style="font-size:12px;color:#16a34a">Compliant</span>' : ''}
      </div>
      ${vlText}
    </div>`;
  }).join('');

  const anyPolicyFail = qaAll.some(({qa}) => qa && qa.youtube_policy && qa.youtube_policy.compliant === false);
  const policyBannerBg = anyPolicyFail ? '#fef2f2' : '#f0fdf4';
  const policyBannerBorder = anyPolicyFail ? '#fca5a5' : '#86efac';
  const policyBannerTitle = anyPolicyFail ? '🚫 YouTube Policy — Issues found' : '✅ YouTube Policy — All clear';
  const policyBannerColor = anyPolicyFail ? '#dc2626' : '#16a34a';
  const policyPanel = `
    <div style="border:2px solid ${policyBannerBorder};border-radius:10px;background:${policyBannerBg};padding:12px 14px;margin-bottom:14px">
      <div style="font-weight:700;font-size:13px;color:${policyBannerColor};margin-bottom:8px">${policyBannerTitle}</div>
      ${policyRows}
    </div>
  `;

  const variants = (seo.title_variants && seo.title_variants.length >= 1) ? seo.title_variants : [{title: seo.title || '', thumbnail_text: seo.thumbnail_text || '', score: null}];
  const tags = (seo.tags || []).map(tag => `<span class="tag-chip">${escapeHtml(tag)}</span>`).join('');

  const fallbackThumbUrl = '/jobs/' + encodeURIComponent(jobId) + '/artifact?path=thumbnail.jpg' + '&t=' + Date.now();
  function variantCard(v, idx) {
    const thumbPath = 'thumbnail_' + (idx + 1) + '.jpg';
    const thumbUrl = '/jobs/' + encodeURIComponent(jobId) + '/artifact?path=' + encodeURIComponent(thumbPath) + '&t=' + Date.now();
    const isWinner = idx === 0;
    const score = (v.score !== undefined && v.score !== null) ? v.score + 'pt' : '';
    const badgeLabel = isWinner
      ? ('⭐ Best' + (score ? ' · ' + score : ''))
      : ('Variant ' + (idx + 1) + (score ? ' · ' + score : ''));
    return `
      <div class="ab-card${isWinner ? ' ab-winner' : ''}">
        <div class="ab-badge${isWinner ? ' winner' : ''}">${badgeLabel}</div>
        <img class="thumb-img" src="${thumbUrl}" alt="thumbnail ${idx + 1}"
             onerror="this.src='${fallbackThumbUrl}';this.onerror=null">
        <div class="ab-title">${escapeHtml(v.title || '')}</div>
        <div class="ab-hook">${escapeHtml(v.thumbnail_text || '')}</div>
        <button class="copy-btn" data-clip="${escapeHtml(v.title || '')}" onclick="copyText(this, this.dataset.clip)">copy title</button>
      </div>`;
  }

  const abSection = `<div class="ab-grid">${variants.slice(0, 3).map((v, i) => variantCard(v, i)).join('')}</div>`;

  mount.innerHTML = `
    <div class="final">
      <div class="final-title"><span>Final output</span><span class="badge">ready</span></div>
      ${policyPanel}
      <video src="${videoUrl}" controls></video>
      ${abSection}
      <div class="final-cols">
        <div>
          <a class="download-link" href="${videoUrl}" download>⬇ Download video.mp4</a>
        </div>
        <div>
          <div class="copy-row">
            <div class="crh"><div class="cr-label">Description <span class="count">${(seo.description || '').length} chars</span></div><button class="copy-btn" onclick="copyText(this, document.getElementById('seo-desc').innerText)">copy</button></div>
            <div class="copy-content scroll" id="seo-desc">${escapeHtml(seo.description || '(missing)')}</div>
          </div>
          <div class="copy-row">
            <div class="crh">
              <div class="cr-label">Suggested Pinned Comment</div>
              <button class="copy-btn" onclick="copyText(this, document.getElementById('pinned-comment').innerText)">copy</button>
            </div>
            <div class="copy-content scroll" id="pinned-comment">${
              typeof seo.suggested_pinned_comments === 'string'
                ? escapeHtml(seo.suggested_pinned_comments)
                : seo.suggested_pinned_comments
                  ? escapeHtml(
                      [
                        seo.suggested_pinned_comments.engagement_boosting || seo.suggested_pinned_comments.engage || '',
                        seo.suggested_pinned_comments.subscriber_growth || seo.suggested_pinned_comments.subscriber || ''
                      ].filter(Boolean).join('\\n\\n') || '(missing)'
                    )
                  : '(missing)'
            }</div>
          </div>
          <div class="copy-row">
            <div class="crh"><div class="cr-label">Tags <span class="count">${(seo.tags || []).length}</span></div><button class="copy-btn" data-clip="${escapeHtml((seo.tags || []).join(', '))}" onclick="copyText(this, this.dataset.clip)">copy</button></div>
            <div class="tag-chips">${tags || '<span class="tag-chip">(missing)</span>'}</div>
          </div>
          <div class="copy-row">
            <div class="copy-content">Language: ${escapeHtml(seo.language || '?')} · AI disclosure: ${seo.ai_disclosure ? 'yes' : 'no'}</div>
          </div>
        </div>
      </div>
      
      
    </div>
  `;
}

function copyText(btn, text) {
  navigator.clipboard.writeText(text || '').then(() => {
    const orig = btn.textContent;
    btn.textContent = 'copied!';
    btn.classList.add('copied');
    showToast('Copied to clipboard');
    setTimeout(() => btn.textContent = orig, 1200);
    setTimeout(() => btn.classList.remove('copied'), 1200);
  });
}

function reopenWs(jobId) {
  if (WS_RETRY_TIMER) {
    clearTimeout(WS_RETRY_TIMER);
    WS_RETRY_TIMER = null;
  }
  if (WS) { try { WS.close(); } catch (e) {} WS = null; }
  if (!jobId) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  WS = new WebSocket(`${proto}//${location.host}/jobs/${jobId}/events`);
  const dot = document.getElementById('ws-dot');
  const label = document.getElementById('ws-label');
  WS.onopen = () => {
    WS_RETRY_MS = 1000;
    dot.className = 'ws-dot live';
    label.textContent = 'live';
  };
  WS.onclose = () => {
    dot.className = 'ws-dot off';
    label.textContent = 'disconnected';
    scheduleWsReconnect(jobId);
  };
  WS.onerror = () => { dot.className = 'ws-dot off'; label.textContent = 'error'; };
  WS.onmessage = (msg) => {
    try {
      const ev = JSON.parse(msg.data);
      appendEvent(ev);
      scheduleTimelineRefresh(jobId, 1200);
    } catch (e) {}
  };
}

function scheduleWsReconnect(jobId) {
  if (!jobId || SELECTED_ID !== jobId) return;
  if (WS_RETRY_TIMER) return;
  const wait = WS_RETRY_MS;
  WS_RETRY_TIMER = setTimeout(() => {
    WS_RETRY_TIMER = null;
    if (SELECTED_ID === jobId) reopenWs(jobId);
  }, wait);
  WS_RETRY_MS = Math.min(15000, Math.round(WS_RETRY_MS * 1.7));
}

function startTimelinePolling() {
  if (TIMELINE_POLL_TIMER) return;
  TIMELINE_POLL_TIMER = setInterval(() => {
    if (SELECTED_ID) fetchTimeline(SELECTED_ID);
  }, 2000);
}

function renderEventsCache() {
  const root = document.getElementById('events');
  if (!root) return;
  root.innerHTML = '';
  for (const row of EVENT_ROWS_CACHE) {
    const div = document.createElement('div');
    div.className = 'ev-row';
    const ts = (row.ts || '').slice(11, 19);
    const stage = row.stage || '';
    div.innerHTML = `<span class="ts">${escapeHtml(ts)}</span><span class="ev-kind ${escapeHtml(row.event || '')}">${escapeHtml(row.event || '')}</span><span class="ev-stage">${escapeHtml(STAGE_LABEL[stage] || stage)}</span>`;
    root.appendChild(div);
  }
  const count = document.getElementById('events-count');
  if (count) count.textContent = root.children.length + ' events';
  root.scrollTop = root.scrollHeight;
}

function appendEvent(ev) {
  if (EVENTS_PAUSED) return;
  EVENT_ROWS_CACHE.push({
    ts: ev.ts || '',
    event: ev.event || '',
    stage: (ev.data && ev.data.stage) ? ev.data.stage : '',
  });
  if (EVENT_ROWS_CACHE.length > EVENT_ROWS_LIMIT) {
    EVENT_ROWS_CACHE = EVENT_ROWS_CACHE.slice(EVENT_ROWS_CACHE.length - EVENT_ROWS_LIMIT);
  }
  const root = document.getElementById('events');
  if (!root) return;
  const div = document.createElement('div');
  div.className = 'ev-row';
  const ts = (ev.ts || '').slice(11, 19);
  const stage = (ev.data && ev.data.stage) ? ev.data.stage : '';
  div.innerHTML = `<span class="ts">${escapeHtml(ts)}</span><span class="ev-kind ${escapeHtml(ev.event)}">${escapeHtml(ev.event)}</span><span class="ev-stage">${escapeHtml(STAGE_LABEL[stage] || stage)}</span>`;
  root.appendChild(div);
  const count = document.getElementById('events-count');
  if (count) count.textContent = root.children.length + ' events';
  root.scrollTop = root.scrollHeight;
}

async function runStage(evt, jobId, stageName) {
  evt.stopPropagation(); // don't toggle the step accordion
  if (isBlockedByApproval(stageName)) {
    const blocked = approvalBlockedBy();
    const blockedLabel = STAGE_LABEL[blocked] || blocked || 'required stage';
    showToast('Please confirm ' + blockedLabel + ' before running next stages.');
    return;
  }
  const executeStage = executionStageFor(stageName);
  const btn = document.getElementById('run-btn-' + stageName);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Running…'; }
  try {
    const autoStages = new Set([
      'idea_research',
      'script',
      'script_qa',
      'scenes',
      'scenes_qa',
      'seo',
      'seo_qa',
      'thumbnail_image',
    ]);
    const suffix = autoStages.has(executeStage) ? '/auto' : '/run';
    const r = await fetch(
      '/jobs/' + encodeURIComponent(jobId) + '/stages/' + encodeURIComponent(executeStage) + suffix,
      { method: 'POST' }
    );
    const d = await r.json();
    if (!r.ok) {
      showToast('Error: ' + (d.detail || r.status));
      if (btn) { btn.disabled = false; btn.textContent = '▶ Run'; }
    } else {
      showToast(stageName + ' completed');
      LAST_TIMELINE_JSON = ''; // force re-render to reflect new state
      if (SELECTED_ID) fetchTimeline(SELECTED_ID);
    }
  } catch (e) {
    showToast('Network error');
    if (btn) { btn.disabled = false; btn.textContent = '▶ Run'; }
  }
}

async function submitNewJob() {
  const errEl = document.getElementById('nj-error');
  errEl.style.display = 'none';
  const jobId = document.getElementById('nj-job-id').value.trim() || _njGenId();
  const channelId = document.getElementById('nj-channel').value;
  const src = document.querySelector('input[name="nj-src"]:checked').value;
  const btn = document.getElementById('nj-submit');

  let idea = null;
  let savedPath = '';

  if (src === 'saved') {
    const idx = parseInt(document.getElementById('nj-idea-select').value, 10);
    if (isNaN(idx) || !_NJ_SAVED_IDEAS[idx]) {
      errEl.textContent = 'Select a saved idea or switch source.';
      errEl.style.display = '';
      return;
    }
    idea = _NJ_SAVED_IDEAS[idx].idea;
    savedPath = _NJ_SAVED_IDEAS[idx].path;
  } else if (src === 'paste') {
    const raw = document.getElementById('nj-idea-json').value.trim();
    if (!raw) { errEl.textContent = 'Paste idea JSON.'; errEl.style.display = ''; return; }
    try { idea = JSON.parse(raw); } catch (e) { errEl.textContent = 'Invalid JSON: ' + e.message; errEl.style.display = ''; return; }
  }

  btn.disabled = true;
  btn.textContent = 'Creating…';

  try {
    // 1. Create job
    const r1 = await fetch('/jobs', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({job_id: jobId, channel_id: channelId, idea_path: savedPath || ''}),
    });
    const d1 = await r1.json();
    if (!r1.ok) {
      errEl.textContent = d1.detail || ('Create failed: ' + r1.status);
      errEl.style.display = '';
      return;
    }

    // 2. Upload idea if we have one
    if (idea) {
      const r2 = await fetch('/jobs/' + encodeURIComponent(jobId) + '/idea', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(idea),
      });
      if (!r2.ok) {
        errEl.textContent = 'Job created but idea upload failed.';
        errEl.style.display = '';
      }
    }

    closeNewJobModal();
    showToast('Job created — pipeline starting…');
    await fetchJobs();
    SELECTED_ID = jobId;
    LAST_TIMELINE_JSON = '';
    await fetchTimeline(jobId);

    // Auto-run full pipeline (fire-and-forget — UI polls for progress)
    fetch('/jobs/' + encodeURIComponent(jobId) + '/run-all', { method: 'POST' })
      .then(async (r) => {
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          const msg = (d && (d.error || d.detail?.error || d.detail)) || ('HTTP ' + r.status);
          throw new Error(String(msg));
        }
        return d;
      })
      .then(() => {
        LAST_TIMELINE_JSON = '';
        if (SELECTED_ID === jobId) fetchTimeline(jobId);
      })
      .catch(e => showToast('Pipeline error: ' + e.message));
  } catch (e) {
    errEl.textContent = 'Error: ' + e.message;
    errEl.style.display = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create Job';
  }
}

async function refreshShorts() {

  if (!jobId) { statusEl.textContent = 'Select a job (click 🎬 on a job card).'; grid.innerHTML = ''; return; }

    const r = await fetch('/jobs/' + encodeURIComponent(jobId) + '/shorts');
    if (!r.ok) { statusEl.textContent = 'No shorts info for ' + jobId; grid.innerHTML = ''; return; }
	    const data = await r.json();
	    statusEl.innerHTML = '<b>' + escapeHtml(jobId) + '</b> — Shorts: ' + escapeHtml(data.label || 'none')
	      + (data.running ? ' <span style="color:var(--red)">●</span>' : '')
	      + renderShortsProgress(data);
	    renderShortsCards(jobId, data);
    if (data.running && !SHORTS_POLL) {
      SHORTS_POLL = setInterval(refreshShorts, 5000);
    } else if (!data.running && SHORTS_POLL) {
      clearInterval(SHORTS_POLL); SHORTS_POLL = null;

  } catch (e) {
    statusEl.textContent = 'Error loading shorts: ' + e;
	  }

	function renderShortsProgress(data) {
	  const shorts = data.shorts || [];
	  if (!data.running && shorts.length === 0) return '';
	  const source = shorts.length ? '✓ source snapshot' : (data.running ? '↻ source snapshot' : '○ source snapshot');
	  const plan = shorts.length ? '✓ plan' : (data.running ? '↻ plan' : '○ plan');
	  const items = [source, plan];
	  for (let i = 1; i <= Math.max(3, shorts.length); i++) {
	    const sid = 'short-0' + i;
	    const s = shorts.find(x => x.short_id === sid);
	    if (s?.status === 'rendered') items.push('✓ ' + sid + ' rendered');
	    else if (s?.status === 'needs_review') items.push('! ' + sid + ' needs review');
	    else if (data.running) items.push((i === 1 ? '↻ ' : '○ ') + sid + (i === 1 ? ' generating' : ' pending'));
	    else items.push('○ ' + sid + ' pending');
	  }
	  return '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">'
	    + items.map(x => '<span style="font-size:11px;border:1px solid var(--border);border-radius:999px;padding:2px 6px">' + escapeHtml(x) + '</span>').join('')
	    + '</div>';
	}

    }
  } catch (e) { alert('Failed to start Shorts: ' + e); }
  finally { btn.disabled = false; btn.textContent = 'Gen Video Shorts'; }
  setTimeout(refreshShorts, 1500);
}

	async function openShortDetail(jobId, shortId, tabName = 'Overview') {

	  const content = document.getElementById('short-detail-content');
	  try {
	    const r = await fetch(url);

	    const text = await r.text();
	    try {
	      content.textContent = JSON.stringify(JSON.parse(text), null, 2);
	    } catch (e) {
	      content.textContent = text;
	    }

	async function copyShortSeo(jobId, shortId) {
	  // SEO lives under json/ in the canonical layout; older shorts kept it at root.
	  const candidates = [
	    'shorts/' + shortId + '/json/short_seo.json',
	    'shorts/' + shortId + '/json/seo.json',
	    'shorts/' + shortId + '/short_seo.json',
	    'shorts/' + shortId + '/seo.json',
	  ];
	  let text = null;
	  for (const path of candidates) {
	    const r = await fetch('/jobs/' + encodeURIComponent(jobId) + '/artifact?path=' + encodeURIComponent(path));
	    if (r.ok) { text = await r.text(); break; }
	  }
	  if (text === null) { alert('SEO artifact not found'); return; }
	  await navigator.clipboard.writeText(text);
	  showToast('Short SEO copied');
	}

// ---- Shorts Studio Page ----
let SHORTS_SELECTED_JOB = null;
let SHORTS_ACTIVE_TAB = 'ideas';
let SHORTS_JOBS_CACHE = [];
let SHORTS_POLL_TIMER = null;
let SHORTS_RENDER_PROGRESS = {};
let SHORTS_RENDER_POLLERS = {};
let LAST_SHORTS_JOBS_JSON = '';
let LAST_IDEAS_JSON_BY_JOB = {};
let LAST_RENDERS_JSON_BY_JOB = {};

async function loadShortsPage() {
  try {
    const r = await fetch('/shorts-studio/state');
    if (!r.ok) return;
    const data = await r.json();
    SHORTS_JOBS_CACHE = (data.eligible_jobs || data.jobs || []).filter(j => j.eligible);
    
    const jobsJson = JSON.stringify(SHORTS_JOBS_CACHE);
    if (jobsJson !== LAST_SHORTS_JOBS_JSON) {
      LAST_SHORTS_JOBS_JSON = jobsJson;
      renderShortsJobList(SHORTS_JOBS_CACHE);
    }
    
    if (SHORTS_SELECTED_JOB) {
      const still = SHORTS_JOBS_CACHE.find(j => j.job_id === SHORTS_SELECTED_JOB);
      if (still) selectShortsJob(SHORTS_SELECTED_JOB, true);
      else { SHORTS_SELECTED_JOB = null; document.getElementById('shorts-detail-panel').innerHTML = '<div class="empty">Select a video on the left to manage its Shorts.</div>'; }
    }
  } catch (e) { console.error('loadShortsPage', e); }
}

function renderShortsJobList(jobs) {
  const list = document.getElementById('shorts-jobs-list');
  document.getElementById('shorts-panel-count').textContent = jobs.length + ' videos';
  if (!jobs.length) { list.innerHTML = '<div style="font-size:12px;color:var(--muted);text-align:center;padding:20px">No eligible jobs found.</div>'; return; }
  list.innerHTML = jobs.map(j => {
    const active = SHORTS_SELECTED_JOB === j.job_id ? ' active' : '';
    const statusColor = j.shorts_status === 'ideas_ready' ? 'var(--green)' : j.shorts_status === 'ideas_generating' || j.shorts_status === 'rendering_selected' ? 'var(--blue)' : j.shorts_status === 'failed' ? 'var(--red)' : '#b8bcc2';
    const pct = j.idea_count > 0 ? Math.min(100, Math.round((j.rendered_short_count / j.idea_count) * 100)) : 0;
    return `<div class="shorts-job-card${active}" onclick="selectShortsJob('${escapeHtml(j.job_id)}')">
      <div class="sj-title">${escapeHtml(j.title || j.job_id)}</div>
      <div class="sj-meta">
        <span style="width:7px;height:7px;border-radius:99px;background:${statusColor};display:inline-block"></span>
        <span>${escapeHtml(j.shorts_status || 'none')}</span>
        <span>·</span>
        <span>${j.idea_count} ideas</span>
        <span>·</span>
        <span>${j.rendered_short_count} rendered</span>
      </div>
      <div class="sj-bar"><div style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

async function selectShortsJob(jobId, isPollUpdate = false) {
  SHORTS_SELECTED_JOB = jobId;
  if (!isPollUpdate) {
    delete LAST_IDEAS_JSON_BY_JOB[jobId];
    delete LAST_RENDERS_JSON_BY_JOB[jobId];
    renderShortsJobList(SHORTS_JOBS_CACHE);
  } else {
    document.querySelectorAll('.shorts-job-card').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.shorts-job-card').forEach(el => {
      if (el.onclick && el.onclick.toString().includes(jobId)) el.classList.add('active');
    });
  }
  const job = SHORTS_JOBS_CACHE.find(j => j.job_id === jobId);
  const panel = document.getElementById('shorts-detail-panel');
  
  if (isPollUpdate && panel && panel.querySelector('.shorts-header-info h3')) {
    const titleEl = panel.querySelector('.shorts-header-info h3');
    const metaEl = panel.querySelector('.shorts-header-info p');
    if (titleEl) titleEl.textContent = job?.title || jobId;
    if (metaEl) metaEl.textContent = jobId + ' · ' + (job?.shorts_status || 'none');
  } else if (panel) {
    panel.innerHTML = `
      <div class="shorts-header">
        <div class="shorts-header-info">
          <h3>${escapeHtml(job?.title || jobId)}</h3>
          <p>${escapeHtml(jobId)} · ${escapeHtml(job?.shorts_status || 'none')}</p>
        </div>
        <div class="shorts-actions">
          <button class="action-btn" onclick="refreshShortsDetail()">↻ Refresh</button>
          <button class="action-btn primary" id="sp-generate-btn" onclick="spGenerateIdeas()">Generate Ideas</button>
          <button class="action-btn danger" id="sp-delete-btn" onclick="spDeleteIdeas()">🗑 Delete Ideas</button>
        </div>
      </div>
      <div class="shorts-tabs">
        <button class="shorts-tab-btn${SHORTS_ACTIVE_TAB === 'ideas' ? ' active' : ''}" onclick="switchShortsTab('ideas')">💡 Ideas</button>
        <button class="shorts-tab-btn${SHORTS_ACTIVE_TAB === 'renders' ? ' active' : ''}" onclick="switchShortsTab('renders')">🎬 Renders</button>
      </div>
      <div id="shorts-tab-ideas" class="shorts-tab-content${SHORTS_ACTIVE_TAB === 'ideas' ? ' active' : ''}">
        <div style="font-size:12px;color:var(--muted)">Loading ideas…</div>
      </div>
      <div id="shorts-tab-renders" class="shorts-tab-content${SHORTS_ACTIVE_TAB === 'renders' ? ' active' : ''}">
        <div style="font-size:12px;color:var(--muted)">Loading renders…</div>
      </div>
    `;
  }
  await Promise.all([loadShortsIdeasTab(jobId), loadShortsRendersTab(jobId)]);
  startShortsPolling();
}

function switchShortsTab(tab) {
  SHORTS_ACTIVE_TAB = tab;
  document.querySelectorAll('.shorts-tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.shorts-tab-content').forEach(c => c.classList.remove('active'));
  const btn = [...document.querySelectorAll('.shorts-tab-btn')].find(b => b.textContent.toLowerCase().includes(tab));
  if (btn) btn.classList.add('active');
  const content = document.getElementById('shorts-tab-' + tab);
  if (content) content.classList.add('active');
}

async function loadShortsIdeasTab(jobId) {
  const container = document.getElementById('shorts-tab-ideas');
  if (!container) return;
  try {
    const r = await fetch('/shorts-studio/jobs/' + encodeURIComponent(jobId) + '/ideas');
    if (!r.ok) {
      container.innerHTML = '<div class="ideas-empty">No ideas yet. Click "Generate Ideas" to start.</div>';
      delete LAST_IDEAS_JSON_BY_JOB[jobId];
      return;
    }
    const data = await r.json();
    const ideas = data.ideas || [];
    
    const ideasJson = JSON.stringify(ideas);
    if (ideasJson === LAST_IDEAS_JSON_BY_JOB[jobId]) {
      return;
    }
    LAST_IDEAS_JSON_BY_JOB[jobId] = ideasJson;
    
    if (!ideas.length) {
      container.innerHTML = '<div class="ideas-empty">No ideas found. Click "Generate Ideas".</div>';
      return;
    }
    container.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:10px">${ideas.length} ideas generated</div>
    <div class="ideas-grid">${ideas.map(idea => {
      let badgeHtml = '';
      if (idea.associated_short) {
        const shortId = idea.associated_short.short_id;
        const status = idea.associated_short.status;
        let statusText = status;
        if (status === 'completed' || status === 'rendered') {
          statusText = 'Completed';
        } else if (status === 'failed') {
          statusText = 'Failed';
        } else {
          statusText = 'In Progress';
        }
        badgeHtml = `<div class="idea-rendered-badge" style="margin-top:6px; display:block; width:fit-content;">✓ Rendered: ${escapeHtml(shortId)} (${statusText})</div>`;
      }
      return `
      <div class="idea-card${idea.associated_short ? ' idea-rendered' : ''}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">
          <div>
            <div class="idea-card-title">${escapeHtml(idea.title || '')} <span style="font-weight:400;color:var(--muted);font-size:12px">(${escapeHtml(idea.idea_id || '')})</span></div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">
              <span class="idea-bucket-badge">${escapeHtml(idea.format || '')}</span>
              <span class="idea-score-badge ${(idea.scores?.overall||0) >= 80 ? 'high' : (idea.scores?.overall||0) >= 60 ? 'mid' : 'low'}">Score: ${idea.scores?.overall || '-'}</span>
              <span class="idea-comp-badge">Safety: ${idea.scores?.safety || '-'}</span>
              ${badgeHtml}
            </div>
          </div>
          ${idea.associated_short ? '' : `<button class="action-btn primary" style="flex-shrink:0" onclick="spRenderIdea('${escapeHtml(idea.idea_id)}', this)">Render Short</button>`}
        </div>
        <div style="font-size:12px;margin-top:8px"><strong>Hook:</strong> ${escapeHtml(idea.hook_text || '')}</div>
        <div style="font-size:12px;margin-top:4px"><strong>Pain:</strong> ${escapeHtml(idea.viewer_pain || '')}</div>
        <div style="font-size:12px;margin-top:4px"><strong>Payoff:</strong> ${escapeHtml(idea.practical_payoff || '')}</div>
        ${idea.key_points && idea.key_points.length ? `<ul class="idea-card-points">${idea.key_points.map(kp => `<li>${escapeHtml(kp.point || '')} <span style="color:var(--muted);font-size:10px">[${(kp.source_scene_ids||[]).join(', ')}]</span></li>`).join('')}</ul>` : ''}
        <div style="font-size:11px;color:var(--muted);margin-top:6px">
          Source: ${escapeHtml((idea.source_scene_ids || []).join(', ') || '-')} · Risk: ${escapeHtml(idea.risk_level || '-')}
        </div>
      </div>
      `;
    }).join('')}</div>`;
  } catch (e) {
    container.innerHTML = '<div class="ideas-empty">Error loading ideas.</div>';
  }
}

function renderShortStep(jobId, shortId, s, idx) {
  const shownStatus = s.status || 'pending';
  const label = s.label || s.name;
  const stageTitle = `${idx + 1}. ${label} (${s.name})`;
  
  const runningStartedAt = s.started_at || null;
  const runningStartMs = parseIsoToMs(runningStartedAt);
  const runningElapsed = runningStartMs === null ? null : Math.max(0, Math.floor((Date.now() - runningStartMs) / 1000));
  
  let durHtml = '';
  if (s.actual_seconds !== null && s.actual_seconds !== undefined) {
    durHtml = `<span class="step-dur">${fmtSec(s.actual_seconds)}</span>`;
  } else if (shownStatus === 'in_progress' && runningStartedAt) {
    durHtml = `<span class="step-dur step-dur-live" data-started-at="${escapeHtml(runningStartedAt)}">${runningElapsed === null ? '' : fmtSec(runningElapsed)}</span>`;
  } else {
    durHtml = '<span class="step-dur"></span>';
  }

  const compactStepGlyph = (
    shownStatus === 'completed'
      ? checkIcon()
      : shownStatus === 'failed'
        ? xIcon()
        : '<span class="step-flow-dot" aria-hidden="true"></span>'
  );

  let inputs = [];
  let outputs = [];
  
  // short_*.json artifacts live under shorts/<sid>/json/, deliverables under
  // shorts/<sid>/outputs/, audio under shorts/<sid>/audio/. (bug-260: stage
  // timeline was pointing the json links at the short root → 404.) The backend
  // artifact endpoint also falls back across these subdirs for older shorts.
  const jsonPrefix = `shorts/${shortId}/json/`;
  const outPrefix = `shorts/${shortId}/outputs/`;
  const audioPrefix = `shorts/${shortId}/audio/`;
  if (s.name === 'script') {
    inputs = [{path: `short_ideas.json`, name: 'short_ideas.json'}];
    outputs = [{path: `${jsonPrefix}short_script.json`, name: 'short_script.json'}];
  } else if (s.name === 'qa_script') {
    inputs = [{path: `${jsonPrefix}short_script.json`, name: 'short_script.json'}];
    outputs = [{path: `${jsonPrefix}short_script_qa.json`, name: 'short_script_qa.json'}];
  } else if (s.name === 'scenes') {
    inputs = [{path: `${jsonPrefix}short_script.json`, name: 'short_script.json'}];
    outputs = [{path: `${jsonPrefix}short_scenes.json`, name: 'short_scenes.json'}];
  } else if (s.name === 'qa_scenes') {
    inputs = [{path: `${jsonPrefix}short_scenes.json`, name: 'short_scenes.json'}];
    outputs = [{path: `${jsonPrefix}short_scenes_qa.json`, name: 'short_scenes_qa.json'}];
  } else if (s.name === 'seo') {
    inputs = [{path: `${jsonPrefix}short_script.json`, name: 'short_script.json'}];
    outputs = [
      {path: `${jsonPrefix}short_seo.json`, name: 'short_seo.json'},
      {path: `${jsonPrefix}short_source_map.json`, name: 'short_source_map.json'}
    ];
  }
 else if (s.name === 'audio') {

    inputs = [{path: `${jsonPrefix}short_scenes.json`, name: 'short_scenes.json'}];
    outputs = [{path: `${audioPrefix}short_mix.m4a`, name: 'short_mix.m4a'}];
  } else if (s.name === 'render') {
    inputs = [{path: `${jsonPrefix}short_render_props.json`, name: 'short_render_props.json'}];
    outputs = [
      {path: `${outPrefix}short.mp4`, name: 'short.mp4'},
      {path: `${outPrefix}short_cover.jpg`, name: 'short_cover.jpg'}
    ];
  }

  const renderFileRow = (f) => {
    const safePath = escapeHtml(f.path);
    const safeName = escapeHtml(f.name);
    // Click to preview using previewArtifact (available if completed)
    const onclick = shownStatus === 'completed' ? `onclick="previewArtifact('${escapeJs(jobId)}','${escapeJs(f.path)}')"` : '';
    const styleStr = shownStatus === 'completed' ? 'cursor:pointer; font-weight: 500;' : 'opacity: 0.65; cursor: not-allowed;';
    return `
      <div class="file-row" ${onclick} style="${styleStr}">
        <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        <span class="file-name" title="${safePath}">${safeName}</span>
      </div>
    `;
  };

  const inputsHtml = inputs.map(renderFileRow).join('') || '<div style="color:var(--muted-2);font-size:12px;padding:6px">No input</div>';
  const outputsHtml = outputs.map(renderFileRow).join('') || '<div style="color:var(--muted-2);font-size:12px;padding:6px">No output yet</div>';

  const isRenderStage = s.name === 'render';
  const isAudioStage = s.name === 'audio';
  let renderProgressHtml = '';
  if (isRenderStage && shownStatus === 'in_progress') {
    const rp = SHORTS_RENDER_PROGRESS[shortId] || { percent: 0, eta: '', fps: 0, frame: 0, total_frames: 0 };
    const pct = rp.percent || 0;
    const etaText = rp.eta || 'Calculating…';
    
    const parts = [];
    if (rp.frame && rp.total_frames) parts.push(rp.frame + '/' + rp.total_frames + ' frames');
    if (rp.fps) parts.push(rp.fps.toFixed(1) + ' fps');
    if (rp.eta) parts.push('ETA ' + rp.eta);
    const metaStr = parts.join(' · ');

    renderProgressHtml = `
      <div class="short-render-progress-container" style="margin:12px 0 4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fafafa">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <span style="font-size:12px;color:var(--muted);font-weight:600">Rendering video & cover…</span>
          <span class="short-render-progress-pct" style="font-size:13px;font-weight:700;color:var(--blue)">${Math.round(pct)}%</span>
        </div>
        <div style="height:6px;border-radius:4px;background:var(--line-strong);overflow:hidden">
          <div class="short-render-progress-bar" style="height:100%;width:${pct}%;background:var(--blue);border-radius:4px;transition:width 1s linear"></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px">
          <span style="color:var(--muted);font-weight:500">⏰ Time remaining:</span>
          <span class="short-render-progress-eta" style="font-weight:700;color:#f5841f">${etaText}</span>
        </div>
        <div class="short-render-progress-meta" style="margin-top:5px;font-size:11px;color:var(--muted-2)">${metaStr}</div>
      </div>
    `;
  } else if (isAudioStage && shownStatus === 'in_progress') {
    const rp = SHORTS_RENDER_PROGRESS[shortId] || { percent: 0, stage: 'Preparing' };
    const pct = rp.percent || 0;
    const currentStage = rp.stage || 'Synthesizing...';

    renderProgressHtml = `
      <div class="short-audio-progress-container" style="margin:12px 0 4px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fafafa">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
          <span style="font-size:12px;color:var(--muted);font-weight:600">Synthesizing TTS & Mixing Audio…</span>
          <span class="short-audio-progress-pct" style="font-size:13px;font-weight:700;color:var(--blue)">${Math.round(pct)}%</span>
        </div>
        <div style="height:6px;border-radius:4px;background:var(--line-strong);overflow:hidden">
          <div class="short-audio-progress-bar" style="height:100%;width:${pct}%;background:var(--blue);border-radius:4px;transition:width 0.5s ease-in-out"></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px">
          <span style="color:var(--muted);font-weight:500">Stage:</span>
          <span class="short-audio-progress-stage" style="font-weight:700;color:#f5841f">${escapeHtml(currentStage)}</span>
        </div>
      </div>
    `;
  }

  return `
    <div class="step ${shownStatus}${shownStatus === 'in_progress' ? ' open' : ''}">
      <div class="step-head" onclick="this.closest('.step').classList.toggle('open')">
        <span class="step-num"><span class="step-order">${String(idx + 1).padStart(2, '0')}</span><span class="step-check">${compactStepGlyph}</span></span>
        <span class="step-label"><span class="name">${escapeHtml(label)}</span><span class="code">${escapeHtml(s.name)}</span></span>
        <span class="step-meta">
          <span class="pill ${shownStatus}">${statusText(shownStatus)}</span>${durHtml}<span class="caret">›</span>
        </span>
      </div>
      <div class="step-body">
        <div class="io-grid">
          <div class="io-box">
            <div class="io-title">Input</div>
            ${inputsHtml}
          </div>
          <div class="io-box">
            <div class="io-title">Output</div>
            ${outputsHtml}
          </div>
        </div>
        ${renderProgressHtml}
        <div class="preview-mount"></div>
      </div>
    </div>
  `;
}

function renderShortStepsTimeline(jobId, draft) {
  const activeStages = draft.stages || inferRenderStages(draft).map(s => {
    let statusVal = 'pending';
    if (s.cls === 'done') statusVal = 'completed';
    else if (s.cls === 'active') statusVal = 'in_progress';
    else if (s.cls === 'fail') statusVal = 'failed';
    
    let nameVal = '';
    if (s.label === 'Script' || s.label === 'Short Script') nameVal = 'script';
    else if (s.label === 'QA Script') nameVal = 'qa_script';
    else if (s.label === 'Scenes' || s.label === 'Short Scenes') nameVal = 'scenes';
    else if (s.label === 'QA Scenes') nameVal = 'qa_scenes';
    else if (s.label === 'SEO' || s.label === 'Short SEO') nameVal = 'seo';
    else if (s.label === 'Audio' || s.label === 'Audio TTS & Mix') nameVal = 'audio';
    else if (s.label === 'Render' || s.label === 'Video & Cover Render') nameVal = 'render';
    
    return {
      name: nameVal,
      label: s.label,
      status: statusVal,
      started_at: null,
      completed_at: null,
      actual_seconds: null
    };
  });

  return `
    <div class="timeline compact" style="margin-top: 14px;">
      ${activeStages.map((stage, idx) => renderShortStep(jobId, draft.short_id, stage, idx)).join('')}
    </div>
  `;
}

function startShortsRenderProgressPolling(jobId, shortId) {
  if (SHORTS_RENDER_POLLERS[shortId]) return;
  SHORTS_RENDER_POLLERS[shortId] = setInterval(async () => {
    if (ACTIVE_PAGE !== 'shorts' || !SHORTS_SELECTED_JOB) {
      clearInterval(SHORTS_RENDER_POLLERS[shortId]);
      delete SHORTS_RENDER_POLLERS[shortId];
      return;
    }
    try {
      const d = (window.SHORTS_DRAFTS_CACHE || []).find(x => x.short_id === shortId);
      if (!d) return;

      const stagesList = d.stages || [];
      const isRenderInProgress = stagesList.length > 0
        ? stagesList.some(s => s.name === 'render' && s.status === 'in_progress')
        : (d.status === 'rendering');
      const isAudioInProgress = stagesList.length > 0
        ? stagesList.some(s => s.name === 'audio' && s.status === 'in_progress')
        : (d.status === 'generating' || d.status === 'in_progress');

      let endpoint = '';
      if (isRenderInProgress) {
        endpoint = '/shorts-studio/jobs/' + encodeURIComponent(jobId) + '/shorts/' + encodeURIComponent(shortId) + '/render/progress';
      } else if (isAudioInProgress) {
        endpoint = '/shorts-studio/jobs/' + encodeURIComponent(jobId) + '/shorts/' + encodeURIComponent(shortId) + '/audio/progress';
      } else {
        clearInterval(SHORTS_RENDER_POLLERS[shortId]);
        delete SHORTS_RENDER_POLLERS[shortId];
        delete SHORTS_RENDER_PROGRESS[shortId];
        return;
      }

      const r = await fetch(endpoint);
      if (!r.ok) {
        // Stage might have finished or failed; reload drafts to update UI
        await loadShortsRendersTab(jobId);
        return;
      }
      const p = await r.json();
      SHORTS_RENDER_PROGRESS[shortId] = p;
      if (p.percent >= 100 || p.stage === 'completed') {
        await loadShortsRendersTab(jobId);
        return;
      }

      const card = document.getElementById('rc-' + shortId);
      if (card) {
        let stages;
        if (stagesList.length > 0) {
          stages = stagesList.map(s => {
            let cls = '';
            if (s.status === 'completed') cls = 'done';
            else if (s.status === 'in_progress') cls = 'active';
            else if (s.status === 'failed') cls = 'fail';
            
            let label = s.label || s.name;
            if (label === 'Short Script') label = 'Script';
            else if (label === 'Short Scenes') label = 'Scenes';
            else if (label === 'Short SEO') label = 'SEO';
            else if (label === 'Audio TTS & Mix') label = 'Audio';
            else if (label === 'Video & Cover Render') label = 'Render';
            
            return { label: label, cls: cls };
          });
        } else {
          stages = inferRenderStages(d);
        }
        
        let doneCount = 0;
        let totalCount = 0;
        if (stagesList.length > 0) {
          totalCount = stagesList.length;
          doneCount = stagesList.filter(s => s.status === 'completed').length;
        } else {
          totalCount = stages.length;
          doneCount = stages.filter(s => s.cls === 'done').length;
        }
        let renderProgressPct = p.percent || 0;
        let percent = totalCount > 0 ? (doneCount / totalCount) * 100 : 0;
        percent = ((doneCount + (renderProgressPct / 100)) / totalCount) * 100;
        percent = Math.min(100, Math.max(0, percent));

        let etaText = '';
        if (isRenderInProgress) {
          etaText = 'Rendering…';
          if (p.eta) {
            etaText = 'Rendering: ETA ' + p.eta;
            if (p.fps > 0) {
              etaText += ' (' + p.fps.toFixed(1) + ' fps)';
            }
          }
        } else if (isAudioInProgress) {
          etaText = `Audio TTS & Mix: ${Math.round(renderProgressPct)}%${p.stage ? ' (' + p.stage + ')' : ''}`;
        }

        const pctEl = card.querySelector('.sum-pct');
        const etaEl = card.querySelector('.sum-eta');
        const barFillEl = card.querySelector('.sum-bar div');

        if (pctEl) pctEl.innerHTML = Math.round(percent) + '<span class="pct-unit" style="font-size:11px;">%</span>';
        if (etaEl) etaEl.innerHTML = etaText;
        if (barFillEl) barFillEl.style.width = percent + '%';

        // Also update sub-progress inside the timeline steps if expanded
        if (isRenderInProgress) {
          const frameEl = card.querySelector('.short-render-progress-meta');
          const progressPctEl = card.querySelector('.short-render-progress-pct');
          const progressBarEl = card.querySelector('.short-render-progress-bar');
          const progressEtaEl = card.querySelector('.short-render-progress-eta');

          const parts = [];
          if (p.frame && p.total_frames) parts.push(p.frame + '/' + p.total_frames + ' frames');
          if (p.fps) parts.push(p.fps.toFixed(1) + ' fps');
          if (p.eta) parts.push('ETA ' + p.eta);
          const metaStr = parts.join(' · ');

          if (frameEl) frameEl.textContent = metaStr;
          if (progressPctEl) progressPctEl.textContent = Math.round(renderProgressPct) + '%';
          if (progressBarEl) progressBarEl.style.width = renderProgressPct + '%';
          if (progressEtaEl) progressEtaEl.textContent = p.eta || 'Calculating…';
        } else if (isAudioInProgress) {
          const progressPctEl = card.querySelector('.short-audio-progress-pct');
          const progressBarEl = card.querySelector('.short-audio-progress-bar');
          const progressStageEl = card.querySelector('.short-audio-progress-stage');

          if (progressPctEl) progressPctEl.textContent = Math.round(renderProgressPct) + '%';
          if (progressBarEl) progressBarEl.style.width = renderProgressPct + '%';
          if (progressStageEl) progressStageEl.textContent = p.stage || 'Synthesizing...';
        }
      }

      // Stop polling when not running/rendering
      const d2 = (window.SHORTS_DRAFTS_CACHE || []).find(x => x.short_id === shortId);
      if (d2) {
        const st = d2.status || '';
        const isRunning = st === 'generating' || st === 'rendering' || st === 'in_progress';
        if (!isRunning) {
          clearInterval(SHORTS_RENDER_POLLERS[shortId]);
          delete SHORTS_RENDER_POLLERS[shortId];
          delete SHORTS_RENDER_PROGRESS[shortId];
        }
      }
    } catch(e) {}
  }, 2000);
}

function renderSingleCardHtml(jobId, d, idx, shortsSeoData, isOpen) {
  const st = d.status || 'pending';
  const isRunning = st === 'generating' || st === 'rendering' || st === 'in_progress';
  const stClass = st === 'rendered' ? 'rendered' : st === 'failed' ? 'failed' : isRunning ? 'in_progress' : '';
  const isStoppedOrFailed = st === 'failed' || st === 'needs_review' || st === 'ready_for_render';
  
  // Calculate stages
  const stagesList = d.stages || [];
  let stages;
  if (stagesList.length > 0) {
    stages = stagesList.map(s => {
      let cls = '';
      if (s.status === 'completed') cls = 'done';
      else if (s.status === 'in_progress') cls = 'active';
      else if (s.status === 'failed') cls = 'fail';
      
      let label = s.label || s.name;
      if (label === 'Short Script') label = 'Script';
      else if (label === 'Short Scenes') label = 'Scenes';
      else if (label === 'Short SEO') label = 'SEO';
      else if (label === 'Audio TTS & Mix') label = 'Audio';
      else if (label === 'Video & Cover Render') label = 'Render';
      
      return { label: label, cls: cls };
    });
  } else {
    stages = inferRenderStages(d);
  }
  
  let doneCount = 0;
  let totalCount = 0;
  let isRenderInProgress = false;
  let isAudioInProgress = false;
  
  if (stagesList.length > 0) {
    totalCount = stagesList.length;
    doneCount = stagesList.filter(s => s.status === 'completed').length;
    isRenderInProgress = stagesList.some(s => s.name === 'render' && s.status === 'in_progress');
    isAudioInProgress = stagesList.some(s => s.name === 'audio' && s.status === 'in_progress');
  } else {
    totalCount = stages.length;
    doneCount = stages.filter(s => s.cls === 'done').length;
    isRenderInProgress = stClass === 'in_progress' && stages[stages.length - 1].cls === 'active';
    isAudioInProgress = stClass === 'in_progress' && stages[stages.length - 2].cls === 'active';
  }
  
  // Retrieve render/audio progress from global cache if in progress
  let renderProgressPct = 0;
  let renderEta = '';
  let renderFps = 0;
  let audioStageText = '';
  if ((isRenderInProgress || isAudioInProgress) && SHORTS_RENDER_PROGRESS[d.short_id]) {
    const rp = SHORTS_RENDER_PROGRESS[d.short_id];
    renderProgressPct = rp.percent || 0;
    renderEta = rp.eta || '';
    renderFps = rp.fps || 0;
    audioStageText = rp.stage || '';
  }
  
  // Calculate blended percentage
  let percent = totalCount > 0 ? (doneCount / totalCount) * 100 : 0;
  if ((isRenderInProgress || isAudioInProgress) && renderProgressPct > 0) {
    percent = ((doneCount + (renderProgressPct / 100)) / totalCount) * 100;
  }
  percent = Math.min(100, Math.max(0, percent));
  
  // Calculate status / ETA text
  const stopped = d.stop_requested || false;
  const failed = stClass === 'failed';
  const allDone = st === 'rendered' || percent >= 100;
  const anyRunningShort = isRunning || stClass === 'in_progress';
  
  let etaText = '';
  if (stopped) {
    etaText = '<b style="color:var(--amber)">Stopped</b>';
  } else if (failed) {
    etaText = '<b style="color:var(--red)">Failed</b>';
  } else if (allDone) {
    etaText = '<b>Completed</b>';
  } else if (isRenderInProgress) {
    if (renderEta) {
      etaText = `Rendering: ETA ${renderEta}`;
      if (renderFps > 0) {
        etaText += ` (${renderFps.toFixed(1)} fps)`;
      }
    } else {
      etaText = 'Rendering…';
    }
  } else if (isAudioInProgress) {
    etaText = `Audio TTS & Mix: ${Math.round(renderProgressPct)}%${audioStageText ? ' (' + audioStageText + ')' : ''}`;
  } else if (anyRunningShort) {
    let activeStageLabel = 'Running…';
    const activeStage = stagesList.find(s => s.status === 'in_progress');
    if (activeStage) {
      activeStageLabel = activeStage.label || activeStage.name;

      const activeInfer = stages.find(s => s.cls === 'active');
      if (activeInfer) activeStageLabel = activeInfer.label;

    etaText = `${activeStageLabel}…`;
  } else {
    etaText = 'Ready to start';
  }
  
  const barClass = failed ? 'failed' : allDone ? 'completed' : '';
  const openClass = isOpen ? ' open' : '';
  
  return `<div class="render-card ${stClass}${openClass}" id="rc-${escapeHtml(d.short_id)}">
    <div class="render-card-head" onclick="toggleRenderCard('${escapeHtml(d.short_id)}')">

      <div class="rc-label">
        <div class="name">
          ${escapeHtml(d.short_id)} ${d.idea_id ? '— ' + escapeHtml(d.idea_id) : ''}
          ${d.title ? ` <span style="font-weight: normal; color: var(--muted-2); font-size: 13px; margin-left: 8px;">— ${escapeHtml(d.title)}</span>` : ''}
        </div>
        <div class="code">${escapeHtml(d.format || '')} · ${escapeHtml(d.qa_verdict || '-')}</div>
        <div style="margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px">${renderQaScenesAttempts(d)}</div>

      <div class="rc-progress" style="text-align: right; margin-right: 14px; min-width: 100px;">
        <div class="sum-pct" style="font-size: 20px; font-weight: 800; line-height: 1;">${Math.round(percent)}<span class="pct-unit" style="font-size: 11px;">%</span></div>
        <div class="sum-eta" style="margin-top: 4px; font-size: 11px;">${etaText}</div>
      </div>
      <span class="pill ${stClass}">${escapeHtml(st)}</span>
    </div>
    <!-- Progress bar below header -->
    <div class="sum-bar ${barClass}" style="margin: 0 14px 10px 54px; height: 5px;"><div style="width: ${percent}%;"></div></div>
    
    <div class="render-card-body">
      ${st === 'rendered' ? (() => {
        const shortVideoUrl = d.video_path ? ('/jobs/' + encodeURIComponent(jobId) + '/artifact?path=' + encodeURIComponent(d.video_path)) : '';
        const shortCoverUrl = d.cover_path ? ('/jobs/' + encodeURIComponent(jobId) + '/artifact?path=' + encodeURIComponent(d.cover_path)) : '';
        const shortSeo = shortsSeoData[d.short_id] || d.seo || {};
        const shortTitle = shortSeo.title || d.title || d.short_id;
        const shortDesc = shortSeo.description || '';
        const shortPinned = shortSeo.pinned_comment || shortSeo.suggested_pinned_comments || '';
        const shortTagsList = shortSeo.hashtags || shortSeo.tags || [];
        const shortTagsHtml = shortTagsList.map(tag => `<span class="tag-chip">${escapeHtml(tag)}</span>`).join('');
        const shortLang = shortSeo.language || 'es-ES';
        const shortAiDisclosure = shortSeo.ai_disclosure !== undefined ? shortSeo.ai_disclosure : true;
        const totalSec = stagesList.reduce((acc, s) => acc + (s.actual_seconds || 0), 0);
        const totalTime = totalSec > 0 ? (totalSec >= 60 ? Math.floor(totalSec/60) + 'm ' + (totalSec%60) + 's' : totalSec + 's') : '';

async function loadShortsRendersTab(jobId) {
  const container = document.getElementById('shorts-tab-renders');
  if (!container) return;
  try {
    const r = await fetch('/shorts-studio/jobs/' + encodeURIComponent(jobId) + '/drafts');
    if (!r.ok) {
      container.innerHTML = '<div class="ideas-empty">No rendered shorts yet.</div>';
      delete LAST_RENDERS_JSON_BY_JOB[jobId];
      return;
    }
    const data = await r.json();
    const drafts = data.drafts || [];
    window.SHORTS_DRAFTS_CACHE = drafts;
    if (!drafts.length) {
      container.innerHTML = '<div class="ideas-empty">No rendered shorts yet. Select an idea and click "Render Short".</div>';
      delete LAST_RENDERS_JSON_BY_JOB[jobId];
      return;
    }

    // Fetch SEO metadata for all rendered shorts
    const shortsSeoData = {};
    const renderedDrafts = drafts.filter(d => d.status === 'rendered');
    if (renderedDrafts.length > 0) {
      await Promise.all(renderedDrafts.map(async d => {
        const sid = d.short_id;
        // Canonical layout writes SEO under shorts/<sid>/json/; older shorts kept
        // it at the short root. Try json/ first, then fall back to root.
        const seoCandidates = [
          'shorts/' + sid + '/json/seo.json',
          'shorts/' + sid + '/json/short_seo.json',
          'shorts/' + sid + '/seo.json',
          'shorts/' + sid + '/short_seo.json',
        ];
        try {
          for (const path of seoCandidates) {
            const sr = await fetch('/jobs/' + encodeURIComponent(jobId) + '/artifact?path=' + encodeURIComponent(path));
            if (sr.ok) {
              shortsSeoData[sid] = await sr.json();
              break;
            }
          }
        } catch (e) {
          console.warn("Failed to fetch SEO for short " + sid, e);
        }
      }));
    }

    const stateKey = JSON.stringify({ drafts, seo: shortsSeoData, progress: SHORTS_RENDER_PROGRESS });
    const rendersStillLoading = container.textContent.includes('Loading renders');
    if (stateKey === LAST_RENDERS_JSON_BY_JOB[jobId] && !rendersStillLoading) {
      return;
    }
    LAST_RENDERS_JSON_BY_JOB[jobId] = stateKey;

    // Check if any draft has active rendering to start duration ticker
    const anyRunning = drafts.some(d => {
      const activeStages = d.stages || [];
      return activeStages.some(s => s.status === 'in_progress') || (d.status && d.status.includes('progress')) || d.status === 'rendering' || d.status === 'queued';
    });
    if (anyRunning) startStageDurationTicker();

    // Keep the renders list itself refreshing while any draft is queued/in
    // progress so the per-Short progress poller picks up as soon as the
    // worker flips the status. Without this we'd only refresh on tab switch
    // and the bar never attaches.
    if (anyRunning) {
      if (!window.SHORTS_RENDERS_LIST_POLL) {
        window.SHORTS_RENDERS_LIST_POLL = setInterval(() => {
          if (ACTIVE_PAGE !== 'shorts' || SHORTS_SELECTED_JOB !== jobId) {
            clearInterval(window.SHORTS_RENDERS_LIST_POLL);
            window.SHORTS_RENDERS_LIST_POLL = null;
            return;
          }
          loadShortsRendersTab(jobId);
        }, 4000);
      }
    } else if (window.SHORTS_RENDERS_LIST_POLL) {
      clearInterval(window.SHORTS_RENDERS_LIST_POLL);
      window.SHORTS_RENDERS_LIST_POLL = null;
    }

    // Start progress polling for active renders/audio
    drafts.forEach(d => {
      const stagesList = d.stages || [];
      const isRenderInProgress = stagesList.length > 0
        ? stagesList.some(s => s.name === 'render' && s.status === 'in_progress')
        : (d.status === 'rendering');
      const isAudioInProgress = stagesList.length > 0
        ? stagesList.some(s => s.name === 'audio' && s.status === 'in_progress')
        : (d.status === 'generating' || d.status === 'in_progress');
      if (isRenderInProgress || isAudioInProgress) {
        startShortsRenderProgressPolling(jobId, d.short_id);
      }
    });
    
    // Keep manual expanded cards open:
    const openShortIds = new Set();
    container.querySelectorAll('.render-card.open').forEach(el => {
      const shortId = el.id.replace('rc-', '');
      openShortIds.add(shortId);
    });

    const existingCards = container.querySelectorAll('.render-card');
    const existingIds = [...existingCards].map(el => el.id.replace('rc-', ''));
    const newIds = drafts.map(d => d.short_id);
    const listsMatch = existingIds.length === newIds.length && existingIds.every((id, idx) => id === newIds[idx]);

    if (!listsMatch) {
      container.innerHTML = `<div style="font-size:12px;color:var(--muted);margin-bottom:10px">${drafts.length} short(s)</div>` +
        drafts.map((d, idx) => renderSingleCardHtml(jobId, d, idx, shortsSeoData, openShortIds.has(d.short_id) || drafts.length === 1)).join('');
    } else {
      window.LAST_DRAFT_STATE_BY_ID = window.LAST_DRAFT_STATE_BY_ID || {};
      drafts.forEach((d, idx) => {
        const dStateKey = JSON.stringify({
          status: d.status,
          qa_verdict: d.qa_verdict,
          stages: d.stages,
          stop_requested: d.stop_requested,
          progress: SHORTS_RENDER_PROGRESS[d.short_id],
          seo: shortsSeoData[d.short_id]
        });
        
        const prevKey = window.LAST_DRAFT_STATE_BY_ID[d.short_id];
        if (prevKey !== dStateKey) {
          window.LAST_DRAFT_STATE_BY_ID[d.short_id] = dStateKey;
          const cardEl = document.getElementById('rc-' + d.short_id);
          if (cardEl) {
            const isOpen = cardEl.classList.contains('open');
            const newHtml = renderSingleCardHtml(jobId, d, idx, shortsSeoData, isOpen);
            const temp = document.createElement('div');
            temp.innerHTML = newHtml;
            const newCardEl = temp.firstElementChild;
            cardEl.replaceWith(newCardEl);
          }
        }
      });
    }
  } catch (e) {
    container.innerHTML = '<div class="ideas-empty">Error loading renders.</div>';
  }
}

function inferRenderStages(draft) {
  const st = draft.status || '';
  const qa = draft.qa_verdict || '';
  const hasVideo = !!draft.video_path;
  const hasAudio = st === 'rendered' || hasVideo || (draft.stages && draft.stages.some(s => s.name === 'audio' && s.status === 'completed'));
  const hasThumb = st === 'rendered' || hasVideo || (draft.stages && draft.stages.some(s => s.name === 'thumbnail' && (s.status === 'completed' || s.status === 'skipped')));
  const stages = [
    { label: 'Script', cls: 'done' },
    { label: 'QA Script', cls: qa ? 'done' : '' },
    { label: 'Scenes', cls: 'done' },
    { label: 'QA Scenes', cls: qa ? 'done' : '' },
    { label: 'SEO', cls: 'done' },
    { label: 'Thumbnail', cls: hasThumb ? 'done' : '' },
    { label: 'Audio', cls: hasAudio ? 'done' : '' },
    { label: 'Render', cls: hasVideo ? 'done' : '' },
  ];

  if (st === 'failed') {
    for (let i = stages.length - 1; i >= 0; i--) { if (!stages[i].cls) { stages[i].cls = 'fail'; break; } }
  }
  if (st === 'rendering' || st === 'in_progress' || st === 'generating') {
    for (let i = 0; i < stages.length; i++) { if (!stages[i].cls) { stages[i].cls = 'active'; break; } }
  }
  if (st === 'rendered' || hasVideo) {
    stages.forEach(s => { if (!s.cls) s.cls = 'done'; });
  }
  return stages;
}

async function spResumeShort(jobId, shortId, currentStatus, btn) {
  if (!jobId || !shortId) return;
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Resuming…';
  try {
    let url = '';
    let method = 'POST';
    let body = null;
    
    if (currentStatus === 'ready_for_render') {
      url = '/shorts-studio/jobs/' + encodeURIComponent(jobId) + '/confirm-render';
      body = JSON.stringify({ short_ids: [shortId] });
    } else {
      // Check if preceding generation stages are completed
      const draft = (window.SHORTS_DRAFTS_CACHE || []).find(d => d.short_id === shortId);
      const stages = draft ? (draft.stages || []) : [];
      const genStages = ['script', 'qa_script', 'scenes', 'qa_scenes', 'seo'];
      const needsRegen = genStages.some(name => {
        const stage = stages.find(s => s.name === name);
        return !stage || stage.status !== 'completed';
      });

      
      if (needsRegen) {
        url = '/jobs/' + encodeURIComponent(jobId) + '/shorts/' + encodeURIComponent(shortId) + '/regenerate';
      } else {
        url = '/jobs/' + encodeURIComponent(jobId) + '/shorts/' + encodeURIComponent(shortId) + '/render';
      }
    }
    
    const r = await fetch(url, {
      method: method,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body
    });
    
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      showToast('Failed to resume: ' + (d.detail?.error || d.detail || r.statusText));
      btn.disabled = false; btn.textContent = orig;
      return;
    }
    
    showToast('Resume enqueued');
    setTimeout(() => refreshShortsDetail(), 1000);
  } catch (e) {
    showToast('Network error');
    btn.disabled = false; btn.textContent = orig;
  }
}
